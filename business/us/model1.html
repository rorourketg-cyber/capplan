<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapPlan Business (US) — Asset Purchase Analysis</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#F7F8FA;color:#0F1D2E;font-size:14px}
input,select,button{font-family:inherit;font-size:14px}
button{cursor:pointer;background:none;border:none}
select{-webkit-appearance:none;appearance:none}
:root{--blue:#1B3F6E;--green:#2E7D52;--surface:#F7F8FA;--panel:#fff;--border:#E2E6EC;--t1:#0F1D2E;--t2:#4A5568;--t3:#8A96A6;--warn:#C84B31;--blue-soft:rgba(27,63,110,0.08);--green-soft:rgba(46,125,82,0.09);--amber:#F59E0B;--amber-soft:#FFFBEB;--amber-dark:#92400E;--amber-mid:#FEF3C7}
#masthead{background:var(--blue);min-height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 16px;position:sticky;top:0;z-index:100;gap:0}
.logo{display:flex;align-items:center;gap:12px;margin-right:20px;flex-shrink:0}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-text{font-family:Georgia,serif;font-size:22px;color:white}.logo-text span{color:#A8C5E8}

#stepper{background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px}
.step{display:flex;align-items:center;gap:8px;padding:13px 4px;border-bottom:2px solid transparent}
.step.active{border-bottom-color:var(--blue)}.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--border);color:var(--t3)}
.step.active .step-num{background:var(--blue);color:white}.step.done .step-num{background:var(--green);color:white}
.step-label{font-size:13px;font-weight:500;color:var(--t3)}.step.active .step-label{color:var(--blue)}.step.done .step-label{color:var(--green)}
.step-sep{color:var(--border);margin:0 8px;font-size:16px}
.page{max-width:1100px;margin:0 auto;padding:24px 22px}
.page-grid{display:grid;grid-template-columns:310px 1fr;gap:22px}
.p2-grid{display:grid;grid-template-columns:280px 1fr;gap:22px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:18px}
.panel-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.panel-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)}
.field-grid{display:grid;grid-template-columns:1fr 1fr}
.field{padding:13px 18px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.field.full{grid-column:1/-1;border-right:none}.field.last{border-bottom:none}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:6px}
.field-note{font-size:10px;color:var(--t3);margin-top:4px}
.ui{display:flex;align-items:center;gap:6px}
.ui .pfx,.ui .sfx{font-family:monospace;font-size:12px;color:var(--t3);flex-shrink:0}
.ui input{font-family:monospace;font-size:15px;font-weight:600;color:var(--t1);border:none;border-bottom:2px solid var(--border);background:transparent;width:100%;padding:2px 0;outline:none}
.ui input:focus{border-bottom-color:var(--blue)}
.ui select{font-family:monospace;font-size:14px;font-weight:600;color:var(--t1);border:none;border-bottom:2px solid var(--border);background:transparent;width:100%;padding:2px 0;outline:none;cursor:pointer}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 13px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;user-select:none}
.pill.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.pill-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--t3);flex-shrink:0}
.pill.active .pill-dot{border-color:var(--blue);background:var(--blue)}
.btn-primary{background:var(--blue);color:white;border:none;border-radius:8px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer}
.btn-ghost{background:transparent;color:var(--t2);border:1.5px solid var(--border);border-radius:8px;padding:11px 22px;font-size:13px;font-weight:600;cursor:pointer}
.print-btn{display:flex;align-items:center;gap:6px;background:transparent;color:var(--t2);border:1.5px solid var(--border);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.print-btn:hover{border-color:var(--blue);color:var(--blue)}
.action-row{display:flex;gap:10px;margin-top:4px}
.bn-item{border-bottom:1px solid var(--border)}.bn-item:last-child{border-bottom:none}
.bn-head{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;cursor:pointer}
.bn-head:hover{background:var(--surface)}
.bn-qmark{width:21px;height:21px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--blue);flex-shrink:0;margin-top:1px;margin-right:5px}
.bn-q{font-size:13px;line-height:1.5;color:var(--blue);flex:1}
.bn-arr{color:var(--t3);font-size:14px;flex-shrink:0;margin-top:2px;transition:transform .2s}
.bn-body{padding:10px 13px 12px 44px;font-size:12.5px;line-height:1.7;color:var(--t2);background:var(--surface);border-top:1px solid var(--border);display:none}
.bn-body.open{display:block}
.watch-btn{margin-top:10px;display:flex;width:fit-content;align-items:center;gap:5px;border:1px solid var(--blue);border-radius:5px;padding:5px 12px;font-size:11px;font-weight:700;color:var(--blue);background:none;cursor:pointer}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:11px}
.helper-card{background:var(--amber-soft);border:2px solid var(--amber);border-radius:10px;overflow:hidden;margin-bottom:18px}
.helper-head{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--amber-mid)}
.helper-head:hover{background:#fde68a}
.helper-icon{font-size:18px;flex-shrink:0}
.helper-title{font-size:13px;font-weight:700;color:var(--amber-dark);flex:1}
.helper-toggle{font-size:11px;font-weight:600;color:var(--amber-dark);opacity:.7}
.helper-body{padding:16px;border-top:1.5px solid var(--amber);display:flex;flex-direction:column;gap:12px}
.result-banner{border-radius:10px;padding:20px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.result-banner.accept{background:var(--green-soft);border:1.5px solid var(--green)}
.result-banner.reject{background:rgba(200,75,49,.07);border:1.5px solid var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.metric-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:7px}
.metric-val{font-family:monospace;font-size:18px;font-weight:700;color:var(--t1)}
.metric-val.ok{color:var(--green)}.metric-val.bad{color:var(--warn)}
.metric-sub{font-size:10px;color:var(--t3);margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.metric{background:white;border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.metric-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:7px}
.metric-val{font-family:monospace;font-size:18px;font-weight:700}
.metric-val.ok{color:var(--green)}
.metric-val.bad{color:var(--warn)}
.metric-sub{font-size:10px;color:var(--t3);margin-top:3px}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:18px}
.chart-title{font-size:14px;font-weight:700;color:var(--t2);margin-bottom:6px}
.chart-sub{font-size:11px;color:var(--t3);margin-bottom:12px}
.collapsible{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px;overflow:hidden}
.coll-head{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.coll-head:hover{background:var(--surface)}
.coll-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)}
.coll-arr{color:var(--t3);font-size:14px;transition:transform .2s}
.coll-body{display:none;border-top:1px solid var(--border)}.coll-body.open{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 14px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
th.left{text-align:left}
td{padding:8px 14px;text-align:right;font-family:monospace;border-bottom:1px solid var(--border)}
td.left{text-align:left;font-family:inherit;color:var(--t1)}
td.sub{text-align:left;font-family:inherit;color:var(--t3);font-size:11px}
td.neg{color:var(--warn)}
tr.total-row td{font-weight:700;background:var(--surface)}
tr:nth-child(even){background:var(--surface)}
tr.highlight td{background:var(--blue-soft)!important;font-weight:700;color:var(--blue)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,29,46,.82);z-index:9999;display:flex;align-items:center;justify-content:center}
.modal-box{background:white;border-radius:10px;overflow:hidden;width:min(820px,95vw)}
.modal-head{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-close{font-size:22px;color:var(--t3);line-height:1;cursor:pointer}
.video-wrap{position:relative;padding-bottom:56.25%;height:0}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;padding:0;background:white}
  #masthead{position:static!important;height:auto!important;padding:8px 0!important}
  #stepper,.btn-ghost,.print-btn,.coll-arr{display:none!important}
  .page-grid,.p2-grid{display:block!important}
  aside{display:none!important}
  .coll-body{display:block!important}
  .coll-head{break-after:avoid!important}
  .result-banner,.metric,.chart-box,.collapsible,.helper-card{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  table{font-size:9px;table-layout:fixed}
  th,td{padding:3px 5px}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  @page{margin:0.5in;size:landscape}
  thead tr:last-child{break-after:avoid!important}
  tbody tr:first-child{break-before:avoid!important}
  th{break-inside:avoid!important;break-after:avoid!important}
  tbody{orphans:3;widows:3}
  .panel{break-inside:avoid}
  .panel-head{break-after:avoid!important}
  .compare-card{break-inside:avoid!important}
  .collapsible{break-inside:avoid!important}
  .sensitivity-section{break-before:page!important}
}

/* US-specific additions */
.macrs-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:18px}
.macrs-class-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.macrs-class-btn{padding:12px 16px;border:none;background:var(--surface);border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:left;cursor:pointer;transition:all .15s}
.macrs-class-btn:hover{background:var(--blue-soft)}
.macrs-class-btn.active{background:var(--blue-soft);border-left:3px solid var(--blue)}
.macrs-class-label{font-size:13px;font-weight:700;color:var(--t1)}
.macrs-class-sub{font-size:10px;color:var(--t3);margin-top:2px}
.bonus-toggle{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--green-soft);border-radius:8px;border:1.5px solid var(--green)}


.model-overview {
  background: var(--amber-soft);
  border: 1.5px solid var(--amber);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--amber-dark);
  line-height: 1.6;
}
.model-overview strong { color: var(--amber-dark); }
.mast-title-block{display:flex;flex-direction:column;justify-content:center;gap:3px;flex:1;min-width:0;padding-right:16px}
.mast-title{font-size:17px;font-weight:800;color:white;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-question{font-size:12px;font-weight:700;font-style:italic;color:rgba(255,255,255,.82);font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.sl-group{display:flex;align-items:center;gap:6px;margin-left:20px}

.sl-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:white;cursor:pointer;white-space:nowrap;transition:background .15s}
.sl-btn:hover{background:rgba(255,255,255,.15)}
.sl-btn svg{flex-shrink:0;pointer-events:none}
.sl-group{display:flex;align-items:center;gap:6px;margin-left:20px}
.sl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8a96a6;margin-bottom:4px}
#save-label-input{width:100%;font-size:13px;padding:6px 8px;border:1px solid #d1d9e0;border-radius:6px;background:#f8f9fa;color:#1a2332;margin-bottom:10px;box-sizing:border-box}
.sl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);cursor:default}
.sl-modal{background:#ffffff;border-radius:12px;padding:24px;width:340px;max-width:90vw;box-shadow:0 4px 6px rgba(0,0,0,.07),0 16px 48px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)}
.sl-modal-title{font-size:15px;font-weight:700;color:#1a2332;margin-bottom:16px}
.sl-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sl-modal-btn{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.sl-modal-btn.primary{background:var(--blue);color:white}
.sl-modal-btn.secondary{background:#f8f9fa;color:#4a5568;border:1px solid #d1d9e0}
.sl-auto-badge{font-size:10px;background:var(--green-soft);color:var(--green);border-radius:4px;padding:2px 6px;font-weight:700}
.sl-help-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:none;color:white;font-size:12px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;transition:background .15s}
.sl-help-btn:hover{background:rgba(255,255,255,.2)}
.sl-help-panel{font-size:13px;color:#2d3748;line-height:1.6}
.sl-help-panel h3{font-size:14px;font-weight:700;color:#1a2332;margin:0 0 12px}
.sl-help-panel ul{margin:0;padding:0 0 0 18px}
.sl-help-panel li{margin-bottom:8px}
.sl-help-panel li strong{color:#1a2332}
.sl-help-panel .sl-help-note{margin-top:14px;padding:10px 12px;background:#f0f4ff;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;font-size:12px;color:#4a5568}

.sl-list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.helper-result{background:var(--green-soft);border:1.5px solid var(--green);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.helper-use{background:var(--green);color:white;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.helper-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-dark)}
.module-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); }
.cur-btn {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px; padding: 6px 12px; color: white; font-size: 12px;
  font-weight: 600; cursor: pointer; position: relative;
}
.cur-btn { display: none !important; }
.sym { font-family: monospace; font-weight: 700; color: #1B3F6E; width: 36px; }
.field-error { font-size: 10px; color: #C84B31; margin-top: 5px; }
.underline-input { display: flex; align-items: center; gap: 6px; }
.underline-input .pfx { font-family: monospace; font-size: 13px; color: #8A96A6; flex-shrink: 0; }
.underline-input input {
  font-family: monospace; font-size: 15px; font-weight: 600; color: #0F1D2E;
  border: none; border-bottom: 2px solid #E2E6EC; background: transparent;
  width: 100%; padding: 2px 0; outline: none;
}
.underline-input input:focus { border-bottom-color: #1B3F6E; }
.underline-input input:disabled { color: #8A96A6; opacity: 0.6; }
.underline-input .sfx { font-size: 13px; color: #8A96A6; flex-shrink: 0; }
.underline-input select {
  font-family: monospace; font-size: 14px; font-weight: 600; color: #0F1D2E;
  border: none; border-bottom: 2px solid #E2E6EC; background: transparent;
  width: 100%; padding: 2px 0; outline: none; cursor: pointer; appearance: none;
}
.underline-input select:focus { border-bottom-color: #1B3F6E; }
.briefing-list { background: white; border: 1px solid #E2E6EC; border-radius: 8px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.tools-box { background: white; border: 1px solid #E2E6EC; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.coc-trigger { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: none; background: none; cursor: pointer; text-align: left; border-radius: 8px; }
.coc-trigger:hover { background: #F7F8FA; }
.coc-icon { width: 34px; height: 34px; background: rgba(46,125,82,0.09); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.coc-open { border: 1px solid #1B3F6E; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 16px rgba(27,63,110,0.12); }

.tab-sub { font-size: 10px; color: #8A96A6; margin-top: 2px; }

.coc-row-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #8A96A6; margin-bottom: 5px; }
.coc-hint { font-size: 10px; color: #8A96A6; margin-top: 3px; }

.coc-result-val { font-family: monospace; font-size: 24px; font-weight: 700; color: #2E7D52; }

.p2-box { background: white; border: 1px solid #E2E6EC; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 18px; max-width: 800px; margin-left: auto; margin-right: auto; }
.p2-head { padding: 16px 22px; border-bottom: 1px solid #E2E6EC; }
.p2-title { font-family: Georgia, serif; font-size: 20px; color: #0F1D2E; margin-bottom: 5px; }
.p2-sub { font-size: 13px; color: #4A5568; line-height: 1.6; }

// ── HELPER FUNCTIONS ────────────────────────────────────────────────────────

// Get MACRS depreciation schedule for a given property class and cost
// Returns array of {year, rate, amount} for each recovery year
function getMACRSSchedule(propertyClass, cost, bonusElected, monthPlacedInService) {
  var table = MACRS_TABLES[propertyClass];
  if (!table) return [];

  // Bonus depreciation (year 1 full expensing if elected)
  if (bonusElected && table.convention !== "mid-month") {
    return [{ year: 1, rate: 100.00, amount: cost }];
  }

  // Real property: straight-line with mid-month convention
  if (table.convention === "mid-month") {
    var schedule = [];
    var fullRate = table.fullYearRate / 100;
    var life = propertyClass === "27.5-year" ? 27.5 : 39;
    var month = monthPlacedInService || 1;  // default to January
    // First year: prorated by month (mid-month: months remaining + 0.5)
    var firstYearMonths = (12 - month + 0.5) / 12;
    var firstYearRate = firstYearMonths / life;
    schedule.push({ year: 1, rate: +(firstYearRate * 100).toFixed(3), amount: cost * firstYearRate });
    // Full years
    var fullYears = Math.floor(life);
    for (var y = 2; y <= fullYears; y++) {
      schedule.push({ year: y, rate: table.fullYearRate, amount: cost * fullRate });
    }
    // Last partial year (remaining months)
    var lastYearMonths = 1 - firstYearMonths;
    if (lastYearMonths > 0.001) {
      var lastRate = lastYearMonths / life;
      schedule.push({ year: fullYears + 1, rate: +(lastRate * 100).toFixed(3), amount: cost * lastRate });
    }
    return schedule;
  }

  // Standard MACRS table lookup (personal property, half-year convention)
  var rates = table.rates;
  return rates.map(function(rate, i) {
    return { year: i + 1, rate: rate, amount: +(cost * rate / 100).toFixed(2) };
  });
}

// Get property class info for display

}

// Get suggested property class from asset type name

  var match = MACRS_ASSET_CLASSES.find(function(a) {
    return a.name === assetTypeName && a.class;
  });
  return match ? match.class : "7-year";  // default to 7-year if not found
}

  if (includeRealProperty) {

  }
  return classes;
}

function getDepreciableBase(){
  var cost=+S.cost,s179=+S.section179||0;

}
function calcDeprSchedule(){
  var base=getDepreciableBase();

function buildBenefits(life){
  if(S.annuity){var arr=[];for(var i=0;i<life;i++)arr.push(+S.annuityAmount||0);return arr;}
  var arr=[];for(var i=0;i<life;i++)arr.push(+(S.yearlyBenefits[i]||0));return arr;
}
function calcAll(){
  var cost=+S.cost,life=+S.life||1,salvage=+S.salvage||0,wc=+S.workingCapital||0;
  var tax=+S.taxRate/100,r=+S.coc/100,s179=+S.section179||0;
  var depr=calcDeprSchedule();
  var benefits=buildBenefits(life);

  var pvTS=depr.reduce(function(s,d){return s+d.amount*tax/Math.pow(1+r,d.year)},0);
  var pvS179=s179*tax/(1+r); // Section 179 deducted fully in year 1
  var pvBen=benefits.reduce(function(s,b,i){return s+b*(1-tax)/Math.pow(1+r,i+1)},0);
  var pvSalv=salvage/Math.pow(1+r,life);
  // Remaining basis at end of life (if any) lost — recapture consideration simplified:
  // if salvage > 0 and asset is fully depreciated, gain on sale is taxed at ordinary/cap gains;
  // for capital planning purposes, treat salvage net of tax on any recapture (simplified: full tax on salvage since basis=0 after full depreciation)
  var totalDepr=depr.reduce(function(s,d){return s+d.amount},0)+s179;
  var remainingBasis=Math.max(0,cost-totalDepr);
  var recaptureTax=salvage>remainingBasis?(salvage-remainingBasis)*tax:0;
  var pvRecapture=-recaptureTax/Math.pow(1+r,life);
  var pvWC=wc>0?wc/Math.pow(1+r,life):0; // working capital recovered at end

  var npv=-cost-wc+pvTS+pvS179+pvBen+pvSalv+pvRecapture+pvWC;

  var robustness=cost>0?Math.min(100,Math.abs(npv)/cost*100):0;
  var robustnessLabel=robustness<5?"Very close call":robustness<15?"Marginal":robustness<30?"Moderate":robustness<50?"Clear":"Very clear";

  // What Would It Take
  var af=(1-Math.pow(1+r,-life))/r;
  var wwit=af>0?(cost+wc-pvTS-pvS179-pvSalv-pvRecapture-pvWC)/((1-tax)*af):0;

  // Additional appraisal metrics
  var pvIn=pvTS+pvS179+pvBen+pvSalv+pvRecapture+pvWC;
  var pvOut=cost+wc;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  var anpv=af>0?npv/af:0;
  var bc=pvOut>0?pvIn/pvOut:0;

  // IRR via Newton-Raphson
  function npvAtRate(rate){
    var cfs=[-pvOut];
    for(var i=0;i<life;i++){
      var yr=i+1;
      var ts=depr.find(function(d){return d.year===yr});
      var cf=(benefits[i]||0)*(1-tax)+(ts?ts.amount*tax:0)+(yr===1?s179*tax:0);
      if(yr===life) cf+=(salvage-recaptureTax)+(wc>0?wc:0);
      cfs.push(cf);
    }
    return cfs.reduce(function(s,cf,i){return s+cf/Math.pow(1+rate,i);},0);
  }
  var irr=r;
  for(var _i=0;_i<120;_i++){
    var f=npvAtRate(irr),df=(npvAtRate(irr+0.0001)-f)/0.0001;
    if(Math.abs(df)<1e-10)break;
    var nx=irr-f/df;
    if(Math.abs(nx-irr)<1e-8){irr=nx;break;}
    irr=nx;
    if(irr<-0.99||irr>100){irr=NaN;break;}
  }

  // Payback (cumulative after-tax cash flows)
  var payback=null,cum=-(cost+wc);
  for(var _j=0;_j<life;_j++){
    var yr=_j+1;
    var ts2=depr.find(function(d){return d.year===yr});
    var atcf=(benefits[_j]||0)*(1-tax)+(ts2?ts2.amount*tax:0)+(_j===0?s179*tax:0);
    if(yr===life) atcf+=(salvage-recaptureTax)+(wc>0?wc:0);
    var prev=cum; cum+=atcf;
    if(cum>=0&&prev<0){payback=_j+(Math.abs(prev)/(Math.abs(prev)+cum));break;}
  }

  // Sensitivity
  var benSens=[-0.40,-0.30,-0.20,-0.10,0,0.10,0.20,0.30,0.40].map(function(delta){
    var b2=benefits.map(function(b){return b*(1+delta)});
    var pvB2=b2.reduce(function(s,b,i){return s+b*(1-tax)/Math.pow(1+r,i+1)},0);
    var npv2=-cost-wc+pvTS+pvS179+pvB2+pvSalv+pvRecapture+pvWC;
    var avgBen2=b2.reduce(function(s,v){return s+v;},0)/Math.max(b2.length,1);return{delta:delta*100,ben:Math.round(avgBen2),npv:npv2};
  });
  var cocSens=[-3,-2,-1,0,1,2,3].map(function(delta){
    var r2=(+S.coc+delta)/100;if(r2<=0)return{coc:+S.coc+delta,npv:0};
    var pvTS2=depr.reduce(function(s,d){return s+d.amount*tax/Math.pow(1+r2,d.year)},0);
    var pvS1792=s179*tax/(1+r2);
    var pvBen2=benefits.reduce(function(s,b,i){return s+b*(1-tax)/Math.pow(1+r2,i+1)},0);
    var pvSalv2=salvage/Math.pow(1+r2,life);
    var pvRecap2=-recaptureTax/Math.pow(1+r2,life);
    var pvWC2=wc>0?wc/Math.pow(1+r2,life):0;
    var npv2=-cost-wc+pvTS2+pvS1792+pvBen2+pvSalv2+pvRecap2+pvWC2;
    return{coc:+S.coc+delta,npv:npv2};
  });

  return{npv:npv,pvTS:pvTS,pvS179:pvS179,pvBen:pvBen,pvSalv:pvSalv,pvRecapture:pvRecapture,
    pvWC:pvWC,depr:depr,benefits:benefits,robustness:robustness,robustnessLabel:robustnessLabel,
    wwit:wwit,benSens:benSens,cocSens:cocSens,totalDepr:totalDepr,remainingBasis:remainingBasis,
    recaptureTax:recaptureTax,irr:irr,payback:payback,bc:bc,anpv:anpv,pvIn:pvIn,pvOut:pvOut,af:af};
}

var NOTES1=[
  {q:"What is MACRS and which property class applies to my asset?",a:"MACRS is the US depreciation system. Property classes range from 3-year to 20-year based on asset type — the model includes a full asset type selector to suggest the right class. When in doubt, check IRS Publication 946."},
  {q:"What is bonus depreciation and should I elect it?",a:"Bonus depreciation allows 100% first-year deduction of qualifying asset cost, permanently under OBBBA. It maximises the early tax shield, making the investment more attractive. Elect it unless you have a specific reason not to — such as insufficient taxable income to absorb it."},
  {q:"What is Section 179 expensing?",a:"An additional first-year deduction up to $2.5 million. Unlike bonus depreciation, it cannot create a net operating loss. It is applied before MACRS and reduces the depreciable basis for subsequent MACRS deductions."}
];
var NOTES2=[
  {q:"What are economic benefits and how do I estimate them?",a:"The annual after-tax cash inflows the asset generates — cost savings, revenue, or efficiency gains. Enter them year by year on page two. Be conservative and document your assumptions."},
  {q:"What is depreciation recapture and why does it appear here?",a:"When you sell an asset for more than its remaining tax basis, the gain up to original cost is taxed as ordinary income rather than capital gains. The model accounts for this in the salvage value calculation."}
];
var NOTES3=[
  {q:"What does a positive NPV tell me?",a:"The investment earns more than your required return. The NPV figure is the value created above and beyond that return — not the total return itself."},
  {q:"What is IRR and how do I use it?",a:"IRR is the Internal Rate of Return — the actual annual return this investment earns. If it exceeds your required return (cost of capital), the investment is financially worthwhile. A higher IRR means a stronger return."},
  {q:"What does the Payback Period tell me?",a:"Payback is the number of years it takes to recover your initial investment from after-tax cash flows. It is a liquidity measure, not a profitability one — a short payback is good for cash flow but does not confirm the investment earns your required return."},
  {q:"What is the Benefit/Cost ratio?",a:"The B/C ratio is the present value of all inflows divided by the present value of all outflows. A ratio above 1.0 means the investment returns more in present value than it costs. It is useful for ranking projects when capital is limited."},
  {q:"What is Annualized NPV?",a:"Annualized NPV (also called ANPV or Equivalent Annual Value) converts the total NPV into an equal annual amount over the asset's life. It is useful for comparing assets with different useful lives on a like-for-like basis."},
  {q:"Why do the sensitivity charts matter?",a:"They show how robust the decision is. If NPV stays positive across a wide range of scenarios the decision is solid. If it turns negative with small changes in cost of capital or benefit level, the decision is marginal and deserves more scrutiny."}
];

  var ke_capm   = +(S.coc_rf+S.coc_beta*S.coc_mrp).toFixed(2);
  var ke        = S.coc_eq_mode==='gordon' ? ke_gordon : ke_capm;

  var wacc      = +(kd_at*S.coc_wd/100 + ke*we/100).toFixed(2);

  }

  html+=result('After-tax cost of borrowing',kd_at,'%');

  // ── Section 2: Cost of equity ──
  html+=sectionHead(2,'Cost of equity','#9F7AEA');

  ['gordon','capm'].forEach(function(m,i){

    var sub=m==='gordon'?'Dividend / earnings growth':'Market risk';
    html+='<button onclick="S.coc_eq_mode=\''+m+'\';renderCoC()" style="flex:1;padding:7px 8px;border-radius:7px;border:1.5px solid '+(active?'var(--blue)':'var(--border)')+';background:'+(active?'var(--blue-soft)':'transparent')+';cursor:pointer;text-align:left"><div style="font-size:11px;font-weight:700;color:'+(active?'var(--blue)':'var(--t2)')+'">'+label+'</div><div style="font-size:10px;color:var(--t3)">'+sub+'</div></button>';
  });
  html+='</div>';

  if(S.coc_eq_mode==='gordon'){
    html+=row('Expected dividend or profit distribution next year ($)','coc_div',S.coc_div,'$','The cash you expect to pay out to owners or shareholders in the coming year. For an owner-managed business, this is the return you expect to take out.');
    html+=row('Current value of the business ($)','coc_price',S.coc_price,'$','What the business is worth today — the price a willing buyer would pay. If you are unsure, use book value or a recent valuation.');
    html+=row('Expected annual growth rate of the firm','coc_g',S.coc_g,'%','How fast do you expect revenues and earnings to grow each year? A stable, mature business might use 2–3%. A growing business might use 5–8%.');

    html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: (annual distribution ÷ business value) + growth rate &nbsp;→&nbsp; '+formula+'</div>';
  } else {

    html+=row('Beta (business risk factor)','coc_beta',S.coc_beta,'','A measure of how risky your business is relative to the overall market. 1.0 = average market risk. Higher values mean more risk. Most small businesses fall between 0.8 and 1.5.');

    html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: risk-free rate + (beta × market risk premium) = '+S.coc_rf+' + ('+S.coc_beta+' × '+S.coc_mrp+')</div>';
  }
  html+=result('Cost of equity',ke,'%');

  // ── Section 3: Overall cost of capital ──
  html+=sectionHead(3,'Overall cost of capital (WACC)','var(--green)');
  html+='<div style="background:var(--surface);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:11px;color:var(--t2)">Carried from above — after-tax cost of borrowing <strong>'+kd_at+'%</strong>, cost of equity <strong>'+ke+'%</strong></div>';
  html+=row('Debt as % of total financing','coc_wd',S.coc_wd,'%','What proportion of your business is funded by loans vs. owner investment? For example, if you borrowed $60 of every $100 invested, enter 60.');
  html+='<div style="font-size:11px;color:var(--t3);margin-bottom:10px">Equity portion: '+(100-S.coc_wd)+'%</div>';
  html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: ('+kd_at+'% × '+S.coc_wd+'%) + ('+ke+'% × '+we+'%) = '+wacc+'%</div>';

  // ── Final result ──
  html+='<div style="margin-top:4px;padding:12px 14px;background:var(--green-soft);border-radius:8px;border:1px solid var(--green);display:flex;justify-content:space-between;align-items:center">';
  html+='<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--green)">Cost of Capital</div><div style="font-family:monospace;font-size:24px;font-weight:700;color:var(--green)">'+wacc+'%</div></div>';
  html+='<button onclick="S.coc='+wacc+';S.coc_open=false;renderCoC();var el=document.getElementById(\'inp-coc\');if(el){el.value='+wacc+';}" style="background:var(--green);color:white;border:none;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer">Use this rate →</button>';
  html+='</div>';

  html+='</div></div>';
  box.innerHTML=html;
}

function drawChart(canvasId,data,xkey,ykey,xfmt,xLabel){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var fresh=canvas.cloneNode(true);canvas.parentNode.replaceChild(fresh,canvas);canvas=fresh;
  var ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  var pad={top:20,bottom:50,left:80,right:16};
  if(xLabel){pad.bottom=66;}
  var cw=W-pad.left-pad.right,ch=H-pad.top-pad.bottom;
  var vals=data.map(function(d){return d[ykey]});
  var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals);
  var rng=maxV-minV||Math.abs(maxV||1)*0.4;
  var lo=minV>=0?0:minV-rng*0.15,hi=maxV+rng*0.15;
  var gap=cw/data.length,bw=Math.floor(gap*0.6);
  var midIdx=Math.floor(data.length/2);
  function toY(v){return(hi===lo)?pad.top+ch/2:pad.top+ch*(hi-v)/(hi-lo);}
  var zeroY=toY(0);
  function drawBase(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#E2E6EC';ctx.lineWidth=1;
    for(var i=0;i<=4;i++){
      var y=pad.top+ch*(i/4);
      ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+cw,y);ctx.stroke();
      var v=hi-(hi-lo)*(i/4);
      ctx.fillStyle='#8A96A6';ctx.font='10px system-ui';ctx.textAlign='right';
      ctx.fillText((v>=0?'$':'-$')+fmt(Math.abs(v)/1000,1)+'k',pad.left-4,y+3);
    }
    ctx.strokeStyle='#C8D0DA';ctx.lineWidth=1.5;ctx.setLineDash([5,3]);
    ctx.beginPath();ctx.moveTo(pad.left,zeroY);ctx.lineTo(pad.left+cw,zeroY);ctx.stroke();
    ctx.setLineDash([]);
    data.forEach(function(d,i){
      var x=pad.left+gap*i+(gap-bw)/2;
      var y0=zeroY,y1=toY(d[ykey]),barH=Math.abs(y1-y0),top=Math.min(y0,y1);
      ctx.fillStyle=d[ykey]>=0?(i===midIdx?'#2E7D52':'#6DBF8A'):(i===midIdx?'#C84B31':'#E88A8A');
      ctx.fillRect(x,top,bw,Math.max(barH,1));
      ctx.fillStyle=i===midIdx?'#1B3F6E':'#8A96A6';
      ctx.font=(i===midIdx?'bold ':'')+'10px system-ui';ctx.textAlign='center';
      ctx.fillText(String(d[xkey])+(xfmt||''),x+bw/2,H-pad.bottom+14);
    });
    ctx.strokeStyle='#4A5568';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pad.left,pad.top);ctx.lineTo(pad.left,pad.top+ch);ctx.lineTo(pad.left+cw,pad.top+ch);ctx.stroke();
    if(xLabel){ctx.fillStyle='#4A5568';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(xLabel,pad.left+cw/2,H-4);}
  }
  function drawTooltip(i){
    var d=data[i],x=pad.left+gap*i+(gap-bw)/2+bw/2,y=toY(d[ykey]);
    ctx.strokeStyle='rgba(27,63,110,0.3)';ctx.lineWidth=1;ctx.setLineDash([3,2]);
    ctx.beginPath();ctx.moveTo(x,pad.top);ctx.lineTo(x,pad.top+ch);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#1B3F6E';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='white';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
    var xLbl=String(d[xkey])+(xfmt||'');
    var yVal=d[ykey];
    var yLbl=(yVal>=0?'':'-')+(ykey==='rate'||ykey==='coc'||ykey==='implied'?fmt(Math.abs(yVal),2)+'%':'$'+fmt(Math.abs(yVal)/1000,2)+'k');
    var text=xLbl+' \u2192 '+yLbl;
    ctx.font='bold 11px system-ui';
    var tw=ctx.measureText(text).width+16,th=22,r2=4;
    var tx=Math.min(Math.max(x-tw/2,pad.left),pad.left+cw-tw);
    var ty=y-th-8;if(ty<pad.top)ty=y+8;
    ctx.fillStyle='rgba(15,29,46,0.88)';
    ctx.beginPath();ctx.moveTo(tx+r2,ty);ctx.lineTo(tx+tw-r2,ty);ctx.arcTo(tx+tw,ty,tx+tw,ty+r2,r2);
    ctx.lineTo(tx+tw,ty+th-r2);ctx.arcTo(tx+tw,ty+th,tx+tw-r2,ty+th,r2);
    ctx.lineTo(tx+r2,ty+th);ctx.arcTo(tx,ty+th,tx,ty+th-r2,r2);
    ctx.lineTo(tx,ty+r2);ctx.arcTo(tx,ty,tx+r2,ty,r2);ctx.closePath();ctx.fill();
    ctx.fillStyle='white';ctx.textAlign='left';ctx.fillText(text,tx+8,ty+15);
  }
  function hitIdx(cx){
    var rect=canvas.getBoundingClientRect(),scaleX=canvas.width/rect.width;
    var px=(cx-rect.left)*scaleX;
    if(px<pad.left||px>pad.left+cw)return -1;
    var i=Math.floor((px-pad.left)/gap);
    return Math.max(0,Math.min(data.length-1,i));
  }
  canvas.addEventListener('mousemove',function(e){drawBase();var i=hitIdx(e.clientX);if(i>=0)drawTooltip(i);});
  canvas.addEventListener('mouseleave',function(){drawBase();});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];drawBase();var i=hitIdx(t.clientX);if(i>=0)drawTooltip(i);},{passive:false});
  canvas.addEventListener('touchend',function(){drawBase();});
  drawBase();
}

// ── Storage: localStorage primary, IndexedDB secondary ───────────────────
var IDB_NAME='capplan';
var IDB_STORE='analyses';
var IDB_MODEL='US1';
var LS_STORE_KEY='capplan_us1_analyses';  // stores all named analyses
var _idb=null;

// localStorage helpers
function lsGetAll(){
  if(!LS_OK)return [];
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    var rows=[];
    Object.keys(obj).forEach(function(k){rows.push(obj[k]);});
    rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
    return rows;
  }catch(e){return [];}
}

function lsSave(payload){
  if(!LS_OK)return false;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    obj[payload.label]=payload;
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
    console.log('[CapPlan] lsSave: saved label='+payload.label+' total='
      +Object.keys(obj).length);
    return true;
  }catch(e){console.error('[CapPlan] lsSave error',e);return false;}
}

function lsLoad(label){
  if(!LS_OK)return null;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    return obj[label]||null;
  }catch(e){return null;}
}

function lsDelete(label){
  if(!LS_OK)return;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    delete obj[label];
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
  }catch(e){}
}

// IndexedDB (used when deployed to a persistent origin)
function openIDB(cb){
  if(_idb){return cb(_idb);}
  var req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE)){
      db.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true});
    }
  };
  req.onsuccess=function(e){
    _idb=e.target.result;
    console.log('[CapPlan] openIDB: success, stores:',Array.from(_idb.objectStoreNames));
    cb(_idb);
  };
  req.onerror=function(){console.error('[CapPlan] openIDB error');cb(null);};
}

function idbSave(payload,cb){
  openIDB(function(db){
    if(!db)return cb&&cb(null);
    var rtx=db.transaction(IDB_STORE,'readonly');
    var rreq=rtx.objectStore(IDB_STORE).getAll();
    rreq.onsuccess=function(){
      var rows=rreq.result||[];
      var existing=rows.filter(function(r){
        return r.model===IDB_MODEL&&r.label===payload.label;
      });
      if(existing.length)payload.id=existing[0].id;
      var wtx=db.transaction(IDB_STORE,'readwrite');
      var store=wtx.objectStore(IDB_STORE);
      if(existing.length){
        store.put(payload);
      } else {
        store.add(payload);
      }
      wtx.oncomplete=function(){
        cb&&cb(true);
      };
      wtx.onerror=function(){console.error('[CapPlan] idbSave tx error');cb&&cb(false);};
    };
    rreq.onerror=function(){
      var wtx=db.transaction(IDB_STORE,'readwrite');
      wtx.objectStore(IDB_STORE).add(payload);
      wtx.oncomplete=function(){cb&&cb(true);};
    };
  });
}

function idbGetAll(cb){
  openIDB(function(db){
    if(!db)return cb([]);
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=function(){
      var all=req.result||[];
      var rows=all.filter(function(r){return r.model===IDB_MODEL;});
      rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
      cb(rows);
    };
    req.onerror=function(){console.error('[CapPlan] idbGetAll error');cb([]);};
  });
}

function idbDelete(id,label,cb){
  lsDelete(label);
  openIDB(function(db){
    if(!db)return cb&&cb();
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=function(){cb&&cb();};
  });
}

// Primary save: localStorage. Secondary: IndexedDB.
function storeSave(payload,cb){
  var lsOk=lsSave(payload);
  idbSave(payload,function(idbOk){
    cb&&cb(lsOk||idbOk);
  });
}

// Primary read: localStorage (reliable on localhost).
// Falls back to IndexedDB if localStorage is empty.
function storeGetAll(cb){
  var lsRows=lsGetAll();
  if(lsRows.length>0){
    cb(lsRows);
  } else {
    idbGetAll(cb);
  }
}

function autoSave(){
  var payload=buildPayload('\u2605 Last session');

  storeSave(payload,null);

function buildPayload(label){
  var fields=['currency', 'coc_open', 'coc_eq_mode', 'coc_kd', 'coc_tax', 'coc_div', 'coc_price', 'coc_g', 'coc_rf', 'coc_beta', 'coc_mrp', 'coc_wd', 'cost', 'itcPct', 'life', 'salvage', 'method', 'hyr', 'ddbRate', 'workingCapital', 'annuity', 'annuityAmount', 'yearlyBenefits', 'taxRate', 'coc'];
  var st={};fields.forEach(function(k){st[k]=S[k];});
  return {capplan_version:'1.0',model:IDB_MODEL,saved:new Date().toISOString(),
          label:label||'Untitled',state:st};
}

function applyPayload(p){
  if(!p||!p.state)return false;
  Object.keys(p.state).forEach(function(k){if(k in S)S[k]=p.state[k];});
  S.res=null;S.page=1;S.show_dcf=false;S.show_table=false;
  return true;
}

        +'<button class="sl-modal-btn primary" style="padding:5px 12px;font-size:12px" '
        +'onclick="loadFromIDB('+row.id+',\''+row.label+'\')"  >Load</button>'
        +'<button class="sl-modal-btn secondary" style="padding:5px 10px;font-size:12px;color:var(--warn)" '
        +'onclick="deleteFromIDB('+row.id+',\''+row.label+'\')"  style="padding:5px 10px;font-size:12px;color:var(--warn)">&#128465;</button>'
        +'</div>';
    });
    html+='</div>';
    area.innerHTML=html;
  });
}

function loadFromIDB(id,label){
  // Try localStorage first (primary store)
  if(label){
    var p=lsLoad(label);
    if(p){
      if(applyPayload(p)){render();closeSLModal();return;}
    }
  }
  // Fall back to IndexedDB
  if(!id){console.error('[CapPlan] loadFromIDB: no id or label found');return;}
  openIDB(function(db){
    if(!db)return;
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).get(id);
    req.onsuccess=function(){
      var p=req.result;
      if(p&&applyPayload(p)){render();closeSLModal();}
    };
  });
}

function deleteFromIDB(id,label){
  idbDelete(id,label,function(){
    loadAnalysis();
  });
}

function handleFileLoad(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(p.model&&p.model!==IDB_MODEL){
        alert('This file is from '+p.model+', not M1. Please load it in the correct model.');return;
      }
      if(applyPayload(p)){
        // also save it into IDB so it appears in the list
        idbSave(p,null);
        render();closeSLModal();
      }
    }catch(err){alert('Could not read file. Please check it is a valid CapPlan JSON file.');}
  };
  reader.readAsText(file);
  event.target.value='';
}



function calcDepr(cost, itcPct, life, method, hyr, ddbRate) {
  var base = cost - cost * itcPct / 100;
  var d = [];
  if (method === "Double-declining") {
    var rate = ddbRate / 100;
    d.push(base * rate * (hyr ? 0.5 : 1));
    for (var y = 2; y <= life; y++) {
      var prev = d.reduce(function(s,v){return s+v;}, 0);
      d.push((base - prev) * rate);
    }
  } else if (method === "Straight-line") {
    var y1 = base / life * (hyr ? 0.5 : 1);
    d.push(y1);
    for (var y = 2; y <= life; y++) d.push(hyr ? (base - y1) / (life - 1) : base / life);
  } else {
    var y1 = hyr ? base/(life+1) : 2*base/(life+1);
    d.push(y1);
    if (hyr) for (var y=2;y<=life;y++) d.push(2*base*(life-y+1)/((life+1)*(life-1)));
    else      for (var y=2;y<=life;y++) d.push(base*(life-y+1)*2/(life*(life+1)));
  }
  return d;
}


function calcBreakEven() {
  // Solve for the constant annual benefit where NPV = 0
  // NPV = pvBen + pvFixed - pvOut = 0
  // pvBen = benefit*(1-tx)*AF
  // => benefit = (pvOut - pvFixed) / ((1-tx)*AF)
  var cost=+S.cost, itcPct=+S.itcPct, life=+S.life||1, salvage=+S.salvage,
      ddbRate=+S.ddbRate, tx=S.taxRate/100, r=S.coc/100, wc=+S.workingCapital;
  var itc=cost*itcPct/100;
  var depr=calcDepr(cost,itcPct,life,S.method,S.hyr,ddbRate);
  var pvOut=cost+wc;
  var pvITC=itc/(1+r);
  var pvS1=depr.length>0?depr[0]*tx/(1+r):0;
  var pvS2=0; for(var i=1;i<depr.length;i++) pvS2+=depr[i]*tx/Math.pow(1+r,i+1);
  var pvSalv=salvage/Math.pow(1+r,life);
  var pvLoss=-(salvage*tx)/Math.pow(1+r,life);
  var pvWC=wc/Math.pow(1+r,life);
  var pvFixed=pvITC+pvS1+pvS2+pvSalv+pvLoss+pvWC;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  return (pvOut-pvFixed)/((1-tx)*af);
}

function makeBriefingList(notes, containerId) {
  var list = document.getElementById(containerId);
  if (!list) return;
  list.innerHTML = "";
  notes.forEach(function(n, i) {
    var item = document.createElement("div");
    item.className = "bn-item";
    var head = document.createElement("div");
    head.className = "bn-head";
    head.innerHTML = '<div class="bn-qmark">?</div><div class="bn-q">'+n.q+'</div><div class="bn-arr" id="arr'+containerId+i+'">›</div>';
    var body = document.createElement("div");
    body.className = "bn-body";
    body.id = "body"+containerId+i;
    body.textContent = n.a;
    if (n.v) {
      var vbtn = document.createElement("button");
      vbtn.className = "watch-btn";
      vbtn.textContent = "▶ Learn More";
      vbtn.onclick = function(e){ e.stopPropagation(); openVideo(n.v); };
      body.appendChild(vbtn);
    }
    head.onclick = function(){
      var isOpen = body.classList.contains("open");
      body.classList.toggle("open");
      document.getElementById("arr"+containerId+i).style.transform = isOpen ? "rotate(0deg)" : "rotate(90deg)";
      head.style.background = isOpen ? "" : "#F7F8FA";
    };
    item.appendChild(head); item.appendChild(body);
    list.appendChild(item);
  });
}

function updateWizard() {
  // Update wizard result div live without full re-render
  var res = document.getElementById('bw-result');
  if (!res) return;
  var suggested = S.bw_type === 'both'
    ? (S.bw_current ? Math.round(S.bw_current) : 0)
    : (S.bw_current && S.bw_improvement ? Math.round(S.bw_current * S.bw_improvement / 100) : 0);
  if (suggested > 0) {
    res.style.display = 'flex';
    var lbl = res.querySelector('#bw-lbl');
    if (lbl) lbl.textContent = getSym() + fmt(suggested, 0);
    var btn = res.querySelector('.wizard-use');
    if (btn) btn.onclick = function() {
      if (!S.annuity && S.annuityAmount > 0) { S.yearlyBenefits[0] = suggested; }
      S.annuity = true; S.annuityAmount = suggested; S.bw_open = false; render();
    };
  } else {
    res.style.display = 'none';
  }
}


function updateYB(idx, val) {
  while (S.yearlyBenefits.length <= idx) S.yearlyBenefits.push(0);
  S.yearlyBenefits[idx] = val;
}



function runCalc() {
  var valErrs=validateInputs();if(valErrs.length>0){S.missingFields=valErrs;render();return;}
  try { S.res = calcAll(); S.page = 3; render(); }
  catch(e) { console.error(e); alert("Calculation error: "+e.message); }
}

// Attach masthead button listeners after DOM is ready
document.addEventListener("DOMContentLoaded",function(){
  var hb=document.getElementById("sl-help-btn");
  var sb=document.getElementById("sl-save-btn");
  var lb=document.getElementById("sl-load-btn");
  console.log("[CapPlan] masthead listeners attached: help="+!!hb+" save="+!!sb+" load="+!!lb);
  // Use event delegation — catches clicks on button OR any child (SVG, text)
  document.getElementById("masthead").addEventListener("click",function(e){
    var t=e.target;
    // Walk up to find the button in case click landed on SVG or span child
    while(t&&t.tagName!=="BUTTON")t=t.parentElement;
    if(!t)return;
    if(t.id==="sl-save-btn"){console.log("[CapPlan] save btn clicked");saveAnalysis();}
    else if(t.id==="sl-load-btn"){console.log("[CapPlan] load btn clicked");loadAnalysis();}
    else if(t.id==="sl-help-btn"){console.log("[CapPlan] help btn clicked");showSLHelp();}
  });
  // Static save modal buttons
  var csb=document.getElementById('sl-confirm-save-btn');
  var cab=document.getElementById('sl-cancel-save-btn');
  var exb=document.getElementById('sl-export-btn');
  if(csb)csb.addEventListener('click',function(e){e.stopPropagation();confirmSave();});
  if(cab)cab.addEventListener('click',function(e){
    e.stopPropagation();
    var sm=document.getElementById('sl-save-modal');
    if(sm)sm.style.display='none';
  });
  if(exb)exb.addEventListener('click',function(e){e.stopPropagation();exportAnalysis();});
  // Stop clicks inside the modal box from reaching the overlay
  var smInner=document.querySelector('#sl-save-modal .sl-modal');
  if(smInner)smInner.addEventListener('click',function(e){e.stopPropagation();});
  // Click on overlay background closes modal
  var smOv=document.getElementById('sl-save-modal');
  if(smOv)smOv.addEventListener('click',function(){
    smOv.style.display='none';
  });
});
