<style>

<script src="/capplan-auth.js"></script>
<script>
var CURRENCIES=[{code:"USD",symbol:"$",label:"US Dollar"},{code:"EUR",symbol:"€",label:"Euro"},{code:"JPY",symbol:"¥",label:"Japanese Yen"},{code:"GBP",symbol:"£",label:"British Pound"},{code:"INR",symbol:"₹",label:"Indian Rupee"},{code:"CHF",symbol:"CHF",label:"Swiss Franc"},{code:"CAD",symbol:"CA$",label:"Canadian Dollar"},{code:"AUD",symbol:"AU$",label:"Australian Dollar"},{code:"NZD",symbol:"NZ$",label:"New Zealand Dollar"}];
function getSym(){var c=CURRENCIES.find(function(c){return c.code===S.currency});return c?c.symbol:"$"}

var S={
  page:1,currency:"USD",cur_open:false,  coc_open:false,coc_eq_mode:"gordon",coc_kd:6,coc_tax:35,coc_div:0,coc_price:0,coc_g:5,coc_rf:4.5,coc_beta:1.0,coc_mrp:5.5,coc_wd:50,
  res:null,show_dcf:false,
  res_tab:0, show_all:false,show_coc_sens:false,show_ben_sens:false,missingFields:null,
  bw_open:false,bw_type:"cost_saving",bw_current:"",bw_improvement:"",
  benefits:"",life:"",svPct:"",method:"Double-declining",hyr:true,ddbRate:"",
  taxRate:"",coc:""
};

function toggleCur(){S.cur_open=!S.cur_open;var dd=document.getElementById("cur-dropdown");dd.style.display=S.cur_open?"block":"none";if(S.cur_open){dd.innerHTML="";CURRENCIES.forEach(function(c){var b=document.createElement("button");b.style.cssText="display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:"+(c.code===S.currency?"var(--blue-soft)":"transparent")+";border:none;border-bottom:1px solid var(--border);cursor:pointer";b.innerHTML='<span style="font-family:monospace;font-size:13px;font-weight:700;color:var(--blue);width:36px">'+c.symbol+'</span><span>'+c.label+'</span>';b.onclick=function(){S.currency=c.code;S.cur_open=false;var dd=document.getElementById('cur-dropdown');if(dd)dd.style.display='none';render();};dd.appendChild(b);});}}

// ── CALC — Analytical solver ──────────────────────────────────────────────────
// NPV = -P + pvBen + P*pvTSfactor(method,hyr,rate,life,r,tax) + P*svPct*(1-tax)/(1+r)^life = 0
// P = pvBen / (1 - pvTSfactor*tax - svPct*(1-tax)/(1+r)^life)

function calcDeprFactors(life,method,hyr,ddbRate){
  // Returns depr per $1 of purchase price for each year
  var d=[];
  if(method==="Double-declining"){var rate=ddbRate/100;d.push(rate*(hyr?0.5:1));for(var y=2;y<=life;y++)d.push((1-d.reduce(function(s,v){return s+v},0))*rate);}
  else if(method==="Straight-line"){var y1=1/life*(hyr?0.5:1);d.push(y1);for(var y=2;y<=life;y++)d.push(hyr?(1-y1)/(life-1):1/life);}
  return d;
}

function calcMaxPrice(benefits,life,svPct,method,hyr,ddbRate,taxRate,coc){
  var tx=taxRate/100, r=coc/100;
  var pvBen=benefits*(1-tx)*((1-Math.pow(1+r,-life))/r);
  var pvTSfactor=0;
  {
    var df=calcDeprFactors(life,method,hyr,ddbRate);
    pvTSfactor=df.reduce(function(s,d,i){return s+d*tx/Math.pow(1+r,i+1)},0);
  }
  var pvSalvFactor=(svPct/100)*(1-tx)/Math.pow(1+r,life);
  var denom=1-pvTSfactor-pvSalvFactor;
  var maxPrice=denom>0?pvBen/denom:0;

  // CoC sensitivity
  var cocSens=[-6,-4,-2,-1,0,1,2,4,6].map(function(delta){
    var r2=(coc+delta)/100;if(r2<=0)return{coc:coc+delta,price:0};
    var pvB2=benefits*(1-tx)*((1-Math.pow(1+r2,-life))/r2);
    var pvTS2=0;
    var df2=calcDeprFactors(life,method,hyr,ddbRate);pvTS2=df2.reduce(function(s,d,i){return s+d*tx/Math.pow(1+r2,i+1)},0);
    var pvS2=(svPct/100)*(1-tx)/Math.pow(1+r2,life);
    var d2=1-pvTS2-pvS2;
    return{coc:coc+delta,price:d2>0?pvB2/d2:0};
  });

  // Benefits sensitivity (±40% in 10% steps)
  var benSens=[-0.40,-0.30,-0.20,-0.10,0,0.10,0.20,0.30,0.40].map(function(delta){
    var b2=benefits*(1+delta);
    var pvB2=b2*(1-tx)*((1-Math.pow(1+r,-life))/r);
    var d2=1-pvTSfactor-pvSalvFactor;
    return{benefits:b2,price:d2>0?pvB2/d2:0,delta:delta*100};
  });

  // Negotiation range: max price at required return vs at 0%
  var pvBen0=benefits*(1-tx)*life; // at r=0
  var ceiling0=denom>0?pvBen0/(1-pvSalvFactor):0;

  return{maxPrice:maxPrice,pvBen:pvBen,pvTSfactor:pvTSfactor,pvSalvFactor:pvSalvFactor,
    cocSens:cocSens,benSens:benSens,negotiationCeiling:ceiling0,denom:denom};
}

function validateInputs(){
  var errs=[];

  if(S.method==="Double-declining"&&!(+S.ddbRate>0)) errs.push("Depreciation rate must be greater than zero for double-declining method");
  if(+S.taxRate<0||+S.taxRate>=100) errs.push("Tax rate must be between 0 and 100");

function drawChart(canvasId,data,current){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;
  var pad={top:16,bottom:48,left:80,right:16};var cw=W-pad.left-pad.right,ch=H-pad.top-pad.bottom;
  ctx.clearRect(0,0,W,H);
  var vals=data.map(function(d){return d.price});var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals);var rng=maxV-minV||maxV*0.2;var lo=minV-rng*0.1,hi=maxV+rng*0.15;
  ctx.strokeStyle="#E2E6EC";ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var y=pad.top+ch*(1-i/4);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+cw,y);ctx.stroke();ctx.fillStyle="#8A96A6";ctx.font="10px system-ui";ctx.textAlign="right";ctx.fillText(getSym()+fmt((lo+(hi-lo)*(i/4))/1000,0)+"k",pad.left-3,y+3);}
  var bw=Math.floor(cw/data.length*0.6),gap=cw/data.length,midIdx=data.findIndex(function(d){return d.coc===current});if(midIdx<0)midIdx=Math.floor(data.length/2);
  data.forEach(function(d,i){var x=pad.left+gap*i+(gap-bw)/2,bh=(d.price-lo)/(hi-lo)*ch,y=pad.top+ch-bh;ctx.fillStyle=i===midIdx?"#1B3F6E":"#93B4D8";ctx.fillRect(x,y,bw,bh);ctx.fillStyle=i===midIdx?"var(--blue)":"#8A96A6";ctx.font=i===midIdx?"bold 10px system-ui":"10px system-ui";ctx.textAlign="center";ctx.fillText(d.coc+"%",x+bw/2,H-pad.bottom+13);});
  ctx.strokeStyle="#4A5568";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pad.left,pad.top+ch);ctx.lineTo(pad.left+cw,pad.top+ch);ctx.stroke();ctx.fillStyle="#4A5568";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText("Required Return (%)",pad.left+cw/2,H-3);

  canvas.style.cursor='crosshair';
  canvas.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});

  var tip=document.createElement('div');
  tip.style.cssText='position:absolute;background:#1B3F6E;color:white;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)';
  canvas.parentNode.style.position='relative';
  canvas.parentNode.appendChild(tip);
  canvas.addEventListener('mousemove',function(e){
    var rect=canvas.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(W/rect.width);
    var hit=null;
    data.forEach(function(d,i){
      var x=pad.left+gap*i+(gap-bw)/2;
      if(mx>=x&&mx<=x+bw) hit=d;
    });
    if(hit){
      tip.style.display='block';
      tip.style.left=(e.clientX-rect.left+12)+'px';
      tip.style.top=(e.clientY-rect.top-28)+'px';
      tip.textContent=hit.coc+'% return: max price '+getSym()+fmt(hit.price,0);
    } else { tip.style.display='none'; }
  });
  canvas.addEventListener('mouseleave',function(){tip.style.display='none';});
}

  });
  html+='</div>';

// ── Storage: localStorage primary, IndexedDB secondary ───────────────────
var IDB_NAME='capplan';
var IDB_STORE='analyses';
var IDB_MODEL='M13';
var LS_STORE_KEY='capplan_m13_analyses';  // stores all named analyses
var _idb=null;

// localStorage helpers
function lsGetAll(){
  if(!LS_OK)return [];
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    var rows=[];
    Object.keys(obj).forEach(function(k){rows.push(obj[k]);});
    rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
    return rows;
  }catch(e){return [];}
}

function lsSave(payload){
  if(!LS_OK)return false;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    obj[payload.label]=payload;
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
    console.log('[CapPlan] lsSave: saved label='+payload.label+' total='
      +Object.keys(obj).length);
    return true;
  }catch(e){console.error('[CapPlan] lsSave error',e);return false;}
}

function lsLoad(label){
  if(!LS_OK)return null;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    return obj[label]||null;
  }catch(e){return null;}
}

function lsDelete(label){
  if(!LS_OK)return;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    delete obj[label];
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
  }catch(e){}
}

// IndexedDB (used when deployed to a persistent origin)
function openIDB(cb){
  if(_idb){return cb(_idb);}
  var req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE)){
      db.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true});
    }
  };
  req.onsuccess=function(e){
    _idb=e.target.result;
    console.log('[CapPlan] openIDB: success, stores:',Array.from(_idb.objectStoreNames));
    cb(_idb);
  };
  req.onerror=function(){console.error('[CapPlan] openIDB error');cb(null);};
}

function idbSave(payload,cb){
  openIDB(function(db){
    if(!db)return cb&&cb(null);
    var rtx=db.transaction(IDB_STORE,'readonly');
    var rreq=rtx.objectStore(IDB_STORE).getAll();
    rreq.onsuccess=function(){
      var rows=rreq.result||[];
      var existing=rows.filter(function(r){
        return r.model===IDB_MODEL&&r.label===payload.label;
      });
      if(existing.length)payload.id=existing[0].id;
      var wtx=db.transaction(IDB_STORE,'readwrite');
      var store=wtx.objectStore(IDB_STORE);
      if(existing.length){
        store.put(payload);
      } else {
        store.add(payload);
      }
      wtx.oncomplete=function(){
        cb&&cb(true);
      };
      wtx.onerror=function(){console.error('[CapPlan] idbSave tx error');cb&&cb(false);};
    };
    rreq.onerror=function(){
      var wtx=db.transaction(IDB_STORE,'readwrite');
      wtx.objectStore(IDB_STORE).add(payload);
      wtx.oncomplete=function(){cb&&cb(true);};
    };
  });
}

function idbGetAll(cb){
  openIDB(function(db){
    if(!db)return cb([]);
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=function(){
      var all=req.result||[];
      var rows=all.filter(function(r){return r.model===IDB_MODEL;});
      rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
      cb(rows);
    };
    req.onerror=function(){console.error('[CapPlan] idbGetAll error');cb([]);};
  });
}

function idbDelete(id,label,cb){
  lsDelete(label);
  openIDB(function(db){
    if(!db)return cb&&cb();
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=function(){cb&&cb();};
  });
}

// Primary save: localStorage. Secondary: IndexedDB.
function storeSave(payload,cb){
  var lsOk=lsSave(payload);
  idbSave(payload,function(idbOk){
    cb&&cb(lsOk||idbOk);
  });
}

// Primary read: localStorage (reliable on localhost).
// Falls back to IndexedDB if localStorage is empty.
function storeGetAll(cb){
  var lsRows=lsGetAll();
  if(lsRows.length>0){
    cb(lsRows);
  } else {
    idbGetAll(cb);
  }
}


// ── Auto-save (localStorage fallback, IndexedDB primary) ─────────────────
var AUTO_SAVE_KEY='capplan_m13_autosave';
var LS_OK=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
var IDB_OK=(location.protocol!=='file:');


function autoSave(){
  var payload=buildPayload('\u2605 Last session');
  // IndexedDB auto-save slot
  // localStorage-primary save (persists reliably on localhost)
  storeSave(payload,null);
}

function buildPayload(label){
  var fields=['currency', 'coc_open', 'coc_eq_mode', 'coc_kd', 'coc_tax', 'coc_div', 'coc_price', 'coc_g', 'coc_rf', 'coc_beta', 'coc_mrp', 'coc_wd', 'cost', 'itcPct', 'life', 'salvage', 'method', 'hyr', 'ddbRate', 'workingCapital', 'annuity', 'annuityAmount', 'yearlyBenefits', 'taxRate', 'coc'];
  var st={};fields.forEach(function(k){st[k]=S[k];});
  return {capplan_version:'1.0',model:IDB_MODEL,saved:new Date().toISOString(),
          label:label||'Untitled',state:st};
}

function applyPayload(p){
  if(!p||!p.state)return false;
  Object.keys(p.state).forEach(function(k){if(k in S)S[k]=p.state[k];});
  S.res=null;S.page=1;S.show_dcf=false;S.show_table=false;
  return true;
}

}
function closeSLModal(){

}

// ── Save ──────────────────────────────────────────────────────────────────
function saveAnalysis(){
  var lbl='';
  if(LS_OK)try{var ex=JSON.parse(localStorage.getItem(AUTO_SAVE_KEY)||'{}');
    if(ex.label&&ex.label!=='★ Last session')lbl=ex.label;}catch(e){}
  var inp=document.getElementById('save-label-input');
  if(inp){inp.value=lbl;}
  var m=document.getElementById('sl-save-modal');
  if(m){m.style.display='flex';}
  setTimeout(function(){if(inp){inp.focus();inp.select();}},50);
}


function confirmSave(){
  var el=document.getElementById('save-label-input');
  var label=(el?el.value.trim():'')||'Untitled analysis';
  var payload=buildPayload(label);
  function afterSave(){
    var sm=document.getElementById('sl-save-modal');
    if(sm)sm.style.display='none';
    closeSLModal();
    var btn=document.getElementById('sl-save-btn');
    if(btn){var orig=btn.innerHTML;
      btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Saved';
      setTimeout(function(){btn.innerHTML=orig;},1800);}
  }
  storeSave(payload,function(ok){
    afterSave();
  });
}

// ── Export (download file) ────────────────────────────────────────────────
function exportAnalysis(){
  var el=document.getElementById('save-label-input');
  var label=(el?el.value.trim():'')||'CapPlan Analysis';
  var payload=buildPayload(label);
  if(LS_OK)try{localStorage.setItem(AUTO_SAVE_KEY,JSON.stringify(payload));}catch(e){}
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download=label.replace(/[^a-z0-9_\- ]/gi,'_').replace(/\s+/g,'_')+'.json';
  a.click();URL.revokeObjectURL(url);
  closeSLModal();
}

// ── Load ──────────────────────────────────────────────────────────────────
function loadAnalysis(){
  var ov=getSLModal();
  if(!IDB_OK){
    ov.innerHTML='<div class="sl-modal" style="width:400px">'
      +'<div class="sl-modal-title">Load Analysis</div>'
      +'<div style="padding:12px 14px;background:rgba(245,158,11,.1);border:1px solid var(--amber);border-radius:8px;font-size:13px;line-height:1.6;margin-bottom:16px">'
      +'<strong>Saved analyses unavailable.</strong><br>'
      +'You are opening this file directly from your hard drive. '
      +'To use Save &amp; Load, open a terminal in your capplan folder and run:<br><br>'
      +'<code style="background:var(--surface);padding:4px 8px;border-radius:4px;font-size:12px">python3 -m http.server 8080</code><br><br>'
      +'Then open in your browser: <code>http://localhost:8080/capplan_model1.html</code>'
      +'</div>'
      +'<div class="sl-label" style="margin-bottom:6px">Or import a previously exported file</div>'
      +'<button class="sl-modal-btn primary" style="width:100%" '
      +'onclick="document.getElementById(\'sl-file-input\').click()">Import file\u2026</button>'
      +'<div class="sl-modal-btns"><button class="sl-modal-btn secondary" onclick="closeSLModal()">Close</button></div>'
      +'</div>';
    return;
  }
  ov.innerHTML='<div class="sl-modal" style="width:420px"><div class="sl-modal-title">Load Analysis</div>'
    +'<div id="sl-list-area"><div style="font-size:13px;color:var(--t2);padding:12px 0">Loading saved analyses\u2026</div></div>'
    +'<div class="sl-modal-btns" style="margin-top:10px">'
    +'<button class="sl-modal-btn secondary" onclick="closeSLModal()">Cancel</button>'
    +'<button class="sl-modal-btn secondary" onclick="document.getElementById(\'sl-file-input\').click()">Import file</button>'
    +'</div></div>';
  storeGetAll(function(rows){
    var area=document.getElementById('sl-list-area');
    if(!area)return;
    if(!rows.length){
      area.innerHTML='<div style="font-size:13px;color:var(--t2);padding:12px 0;text-align:center">'
        +'No saved analyses yet.<br>Fill in the form and click Save to store one.</div>';
      return;
    }
    var html='<div style="max-height:280px;overflow-y:auto;margin:0 -4px">';
    rows.forEach(function(row){
      var d=new Date(row.saved);
      var dateStr=d.toLocaleDateString(undefined,{month:'short',day:'numeric'})
        +' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
      var isAuto=row.label==='\u2605 Last session';
      html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)">'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
        +(isAuto?'<span style="color:var(--t3);font-size:11px;margin-right:4px">&#9733;</span>':'')+row.label+'</div>'
        +'<div style="font-size:11px;color:var(--t3)">'+dateStr+'</div>'
        +'</div>'
        +'<button class="sl-modal-btn primary" style="padding:5px 12px;font-size:12px" '
        +'onclick="loadFromIDB('+row.id+',\''+row.label+'\')"  >Load</button>'
        +'<button class="sl-modal-btn secondary" style="padding:5px 10px;font-size:12px;color:var(--warn)" '
        +'onclick="deleteFromIDB('+row.id+',\''+row.label+'\')"  style="padding:5px 10px;font-size:12px;color:var(--warn)">&#128465;</button>'
        +'</div>';
    });
    html+='</div>';
    area.innerHTML=html;
  });
}

function loadFromIDB(id,label){
  // Try localStorage first (primary store)
  if(label){
    var p=lsLoad(label);
    if(p){
      if(applyPayload(p)){render();closeSLModal();return;}
    }
  }
  // Fall back to IndexedDB
  if(!id){console.error('[CapPlan] loadFromIDB: no id or label found');return;}
  openIDB(function(db){
    if(!db)return;
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).get(id);
    req.onsuccess=function(){
      var p=req.result;
      if(p&&applyPayload(p)){render();closeSLModal();}
    };
  });
}

function deleteFromIDB(id,label){
  idbDelete(id,label,function(){
    loadAnalysis();
  });
}

// ── Import from file ──────────────────────────────────────────────────────
function handleFileLoad(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(p.model&&p.model!==IDB_MODEL){
        alert('This file is from '+p.model+', not M1. Please load it in the correct model.');return;
      }
      if(applyPayload(p)){
        // also save it into IDB so it appears in the list
        idbSave(p,null);
        render();closeSLModal();
      }
    }catch(err){alert('Could not read file. Please check it is a valid CapPlan JSON file.');}
  };
  reader.readAsText(file);
  event.target.value='';
}

// Attach masthead button listeners after DOM is ready
document.addEventListener("DOMContentLoaded",function(){
  var hb=document.getElementById("sl-help-btn");
  var sb=document.getElementById("sl-save-btn");
  var lb=document.getElementById("sl-load-btn");
  console.log("[CapPlan] masthead listeners attached: help="+!!hb+" save="+!!sb+" load="+!!lb);
  // Use event delegation — catches clicks on button OR any child (SVG, text)
  document.getElementById("masthead").addEventListener("click",function(e){
    var t=e.target;
    // Walk up to find the button in case click landed on SVG or span child
    while(t&&t.tagName!=="BUTTON")t=t.parentElement;
    if(!t)return;
    if(t.id==="sl-save-btn"){console.log("[CapPlan] save btn clicked");saveAnalysis();}
    else if(t.id==="sl-load-btn"){console.log("[CapPlan] load btn clicked");loadAnalysis();}
    else if(t.id==="sl-help-btn"){console.log("[CapPlan] help btn clicked");showSLHelp();}
  });
  // Static save modal buttons
  var csb=document.getElementById('sl-confirm-save-btn');
  var cab=document.getElementById('sl-cancel-save-btn');
  var exb=document.getElementById('sl-export-btn');
  if(csb)csb.addEventListener('click',function(e){e.stopPropagation();confirmSave();});
  if(cab)cab.addEventListener('click',function(e){
    e.stopPropagation();
    var sm=document.getElementById('sl-save-modal');
    if(sm)sm.style.display='none';
  });
  if(exb)exb.addEventListener('click',function(e){e.stopPropagation();exportAnalysis();});
  // Stop clicks inside the modal box from reaching the overlay
  var smInner=document.querySelector('#sl-save-modal .sl-modal');
  if(smInner)smInner.addEventListener('click',function(e){e.stopPropagation();});
  // Click on overlay background closes modal
  var smOv=document.getElementById('sl-save-modal');
  if(smOv)smOv.addEventListener('click',function(){
    smOv.style.display='none';
  });
});
