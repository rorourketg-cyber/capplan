<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapPlan — Asset Purchase Analysis</title>
<style>
:root {
  --blue:#1B3F6E; --green:#2E7D52; --surface:#F7F8FA; --panel:#fff;
  --border:#E2E6EC; --t1:#0F1D2E; --t2:#4A5568; --t3:#8A96A6; --warn:#C84B31;
  --blue-soft:rgba(27,63,110,0.08); --green-soft:rgba(46,125,82,0.09);
  --amber:#F59E0B; --amber-soft:#FFFBEB; --amber-dark:#92400E; --amber-light:#FEF3C7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #F7F8FA; color: #0F1D2E; font-size: 14px; }
input, select, button { font-family: inherit; font-size: 14px; }
button { cursor: pointer; }

#masthead {
  background: #1B3F6E;
  height: 80px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 100;
}
#masthead .logo { display: flex; align-items: center; gap: 12px; }
#masthead .logo-icon {
  width: 34px; height: 34px; background: #2E7D52;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
}
#masthead .logo-text { font-family: Georgia, serif; font-size: 22px; color: white; }
#masthead .logo-text span { color: #A8C5E8; }
#masthead .module-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); }
#masthead .cur-btn {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px; padding: 6px 12px; color: white; font-size: 12px;
  font-weight: 600; cursor: pointer; position: relative;
}
#cur-dropdown {
  position: absolute; right: 0; top: 110%; background: white;
  border: 1px solid #E2E6EC; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12); min-width: 200px;
  z-index: 200; display: none;
}
#cur-dropdown.open { display: block; }
#cur-dropdown button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 14px; background: none; border: none;
  border-bottom: 1px solid #E2E6EC; text-align: left; cursor: pointer;
}
#cur-dropdown button:hover { background: #F7F8FA; }
#cur-dropdown button .sym { font-family: monospace; font-weight: 700; color: #1B3F6E; width: 36px; }

#stepper {
  background: white; border-bottom: 1px solid #E2E6EC;
  display: flex; align-items: center; padding: 0 28px;
}
.step { display: flex; align-items: center; gap: 8px; padding: 14px 4px; border-bottom: 2px solid transparent; }
.step.active { border-bottom-color: #1B3F6E; }
.step-num {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  background: #E2E6EC; color: #8A96A6;
}
.step.active .step-num { background: #1B3F6E; color: white; }
.step.done .step-num { background: #2E7D52; color: white; }
.step-label { font-size: 13px; font-weight: 500; color: #8A96A6; white-space: nowrap; }
.step.active .step-label { color: #1B3F6E; }
.step.done .step-label { color: #2E7D52; }
.step-sep { color: #E2E6EC; margin: 0 8px; font-size: 16px; }

.page { max-width: 1080px; margin: 0 auto; padding: 24px 22px; }
.page-grid { display: grid; grid-template-columns: 310px 1fr; gap: 22px; }

.panel { background: white; border: 1px solid #E2E6EC; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
.panel-head { padding: 12px 18px; border-bottom: 1px solid #E2E6EC; display: flex; align-items: center; gap: 10px; }
.panel-dot { width: 8px; height: 8px; border-radius: 50%; background: #1B3F6E; flex-shrink: 0; }
.panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #4A5568; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; }
.field { padding: 14px 18px; border-bottom: 1px solid #E2E6EC; border-right: 1px solid #E2E6EC; }
.field.full { grid-column: 1 / -1; border-right: none; }
.field.last { border-bottom: none; }
.field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #8A96A6; margin-bottom: 7px; }
.field-note { font-size: 10px; color: #8A96A6; margin-top: 5px; }
.field-error { font-size: 10px; color: #C84B31; margin-top: 5px; }

.underline-input { display: flex; align-items: center; gap: 6px; }
.underline-input .pfx { font-family: monospace; font-size: 13px; color: #8A96A6; flex-shrink: 0; }
.underline-input input {
  font-family: monospace; font-size: 15px; font-weight: 600; color: #0F1D2E;
  border: none; border-bottom: 2px solid #E2E6EC; background: transparent;
  width: 100%; padding: 2px 0; outline: none;
}
.underline-input input:focus { border-bottom-color: #1B3F6E; }
.underline-input input:disabled { color: #8A96A6; opacity: 0.6; }
.underline-input .sfx { font-size: 13px; color: #8A96A6; flex-shrink: 0; }
.sl-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:white;cursor:pointer;white-space:nowrap;transition:background .15s}
.sl-btn:hover{background:rgba(255,255,255,.15)}
.sl-btn svg{flex-shrink:0;pointer-events:none}
.sl-group{display:flex;align-items:center;gap:6px;margin-left:20px}
.sl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8a96a6;margin-bottom:4px}
#save-label-input{width:100%;font-size:13px;padding:6px 8px;border:1px solid #d1d9e0;border-radius:6px;background:#f8f9fa;color:#1a2332;margin-bottom:10px;box-sizing:border-box}
.sl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);cursor:default}
.sl-modal{background:#ffffff;border-radius:12px;padding:24px;width:340px;max-width:90vw;box-shadow:0 4px 6px rgba(0,0,0,.07),0 16px 48px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)}
.sl-modal-title{font-size:15px;font-weight:700;color:#1a2332;margin-bottom:16px}
.sl-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sl-modal-btn{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.sl-modal-btn.primary{background:var(--blue);color:white}
.sl-modal-btn.secondary{background:#f8f9fa;color:#4a5568;border:1px solid #d1d9e0}
.sl-auto-badge{font-size:10px;background:var(--green-soft);color:var(--green);border-radius:4px;padding:2px 6px;font-weight:700}
.sl-help-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:none;color:white;font-size:12px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;transition:background .15s}
.sl-help-btn:hover{background:rgba(255,255,255,.2)}
.sl-help-panel{font-size:13px;color:#2d3748;line-height:1.6}
.sl-help-panel h3{font-size:14px;font-weight:700;color:#1a2332;margin:0 0 12px}
.sl-help-panel ul{margin:0;padding:0 0 0 18px}
.sl-help-panel li{margin-bottom:8px}
.sl-help-panel li strong{color:#1a2332}
.sl-help-panel .sl-help-note{margin-top:14px;padding:10px 12px;background:#f0f4ff;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;font-size:12px;color:#4a5568}

.sl-list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.underline-input select {
  font-family: monospace; font-size: 14px; font-weight: 600; color: #0F1D2E;
  border: none; border-bottom: 2px solid #E2E6EC; background: transparent;
  width: 100%; padding: 2px 0; outline: none; cursor: pointer; appearance: none;
}
.underline-input select:focus { border-bottom-color: #1B3F6E; }

.pills { display: flex; gap: 10px; margin-top: 4px; }
.pill {
  display: flex; align-items: center; gap: 7px; padding: 6px 14px;
  border: 1.5px solid #E2E6EC; border-radius: 20px; font-size: 13px;
  font-weight: 500; color: #4A5568; cursor: pointer; user-select: none;
  background: transparent;
}
.pill.active { border-color: #1B3F6E; background: rgba(27,63,110,0.07); color: #1B3F6E; }
.pill-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #8A96A6; flex-shrink: 0; }
.pill.active .pill-dot { border-color: #1B3F6E; background: #1B3F6E; }

.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #8A96A6; margin-bottom: 12px; }
.briefing-list { background: white; border: 1px solid #E2E6EC; border-radius: 8px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.bn-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; background: transparent; }
.bn-head:hover { background: #F7F8FA; }
.bn-qmark {
  width: 22px; height: 22px; border-radius: 50%; background: rgba(27,63,110,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #1B3F6E;
  flex-shrink: 0; margin-top: 1px; margin-right: 6px;
}
.bn-q { font-size: 13px; line-height: 1.5; color: #1B3F6E; flex: 1; }
.bn-arr { color: #8A96A6; font-size: 15px; flex-shrink: 0; margin-top: 1px; transition: transform 0.2s; }
.bn-body { padding: 10px 14px 12px 46px; font-size: 12.5px; line-height: 1.7; color: #4A5568; background: #F7F8FA; border-top: 1px solid #E2E6EC; display: none; }
.bn-body.open { display: block; }
.bn-item { border-bottom: 1px solid #E2E6EC; }
.bn-item:last-child { border-bottom: none; }
.watch-btn {
  margin-top: 10px; display: flex; width: fit-content; align-items: center; gap: 5px;
  border: 1px solid #1B3F6E; border-radius: 5px; padding: 5px 12px;
  font-size: 11px; font-weight: 700; color: #1B3F6E; background: none; cursor: pointer;
}

.tools-box { background: white; border: 1px solid #E2E6EC; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.coc-trigger { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: none; background: none; cursor: pointer; text-align: left; border-radius: 8px; }
.coc-trigger:hover { background: #F7F8FA; }
.coc-icon { width: 34px; height: 34px; background: rgba(46,125,82,0.09); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.coc-open { border: 1px solid #1B3F6E; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 16px rgba(27,63,110,0.12); }
.coc-head { background: #1B3F6E; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; }
.coc-head span { font-size: 12px; font-weight: 700; color: white; }
.coc-head button { background: none; border: none; color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer; line-height: 1; }
.coc-tabs { display: flex; gap: 8px; padding: 12px 14px 0; }
.coc-tab { flex: 1; padding: 9px 10px; border-radius: 7px; border: 1.5px solid #E2E6EC; background: transparent; cursor: pointer; text-align: left; }
.coc-tab.active { border-color: #1B3F6E; background: rgba(27,63,110,0.07); }
.coc-tab .tab-name { font-size: 12px; font-weight: 700; color: #4A5568; }
.coc-tab.active .tab-name { color: #1B3F6E; }
.coc-tab .tab-sub { font-size: 10px; color: #8A96A6; margin-top: 2px; }
.coc-body { padding: 14px; }
.coc-row { margin-bottom: 12px; }
.coc-row-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #8A96A6; margin-bottom: 5px; }
.coc-hint { font-size: 10px; color: #8A96A6; margin-top: 3px; }
.coc-formula { background: #F7F8FA; border-radius: 5px; padding: 9px 10px; font-size: 11px; color: #4A5568; margin-top: 4px; }
.coc-result { margin-top: 12px; padding: 12px 14px; background: rgba(46,125,82,0.09); border: 1px solid #2E7D52; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
.coc-result-val { font-family: monospace; font-size: 24px; font-weight: 700; color: #2E7D52; }
.use-btn { background: #2E7D52; color: white; border: none; border-radius: 7px; padding: 9px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }

.action-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.btn-primary { background: #1B3F6E; color: white; border: none; border-radius: 8px; padding: 11px 22px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-primary:hover { background: #163357; }
.btn-ghost { background: transparent; color: #4A5568; border: 1.5px solid #E2E6EC; border-radius: 8px; padding: 11px 22px; font-size: 13px; font-weight: 600; cursor: pointer; }

/* Page 2 */
.p2-box { background: white; border: 1px solid #E2E6EC; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 18px; max-width: 800px; margin-left: auto; margin-right: auto; }
.p2-head { padding: 16px 22px; border-bottom: 1px solid #E2E6EC; }
.p2-title { font-family: Georgia, serif; font-size: 20px; color: #0F1D2E; margin-bottom: 5px; }
.p2-sub { font-size: 13px; color: #4A5568; line-height: 1.6; }
.p2-toggle { padding: 18px 22px; border-bottom: 1px solid #E2E6EC; }
.p2-annuity { padding: 18px 22px; border-bottom: 1px solid #E2E6EC; }
.var-head { display: grid; grid-template-columns: 72px 1fr 1fr; gap: 0 14px; padding: 10px 22px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #8A96A6; border-bottom: 1px solid #E2E6EC; }
.var-row { display: grid; grid-template-columns: 72px 1fr 1fr; gap: 0 14px; padding: 9px 22px; align-items: center; border-bottom: 1px solid #E2E6EC; }
.var-row:nth-child(odd) { background: #F7F8FA; }
.var-yr { font-size: 12px; font-weight: 600; color: #4A5568; }
.var-at { font-family: monospace; font-size: 13px; color: #2E7D52; }
.var-list { max-height: 360px; overflow-y: auto; }
.p2-actions { display: flex; justify-content: space-between; gap: 10px; max-width: 800px; margin: 0 auto; }

/* Page 3 */
.p3-grid { display: grid; grid-template-columns: 272px 1fr; gap: 22px; }
.banner { border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; }
.banner.positive { background: rgba(46,125,82,0.09); border: 1.5px solid #2E7D52; }
.banner.negative { background: rgba(200,75,49,0.07); border: 1.5px solid #C84B31; }
.banner-headline { font-family: Georgia, serif; font-size: 22px; line-height: 1.2; }
.banner.positive .banner-headline { color: #2E7D52; }
.banner.negative .banner-headline { color: #C84B31; }
.banner-sub { font-size: 13px; color: #4A5568; margin-top: 6px; line-height: 1.6; }
.banner-npv { text-align: right; flex-shrink: 0; margin-left: 20px; }
.banner-npv-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #8A96A6; }
.banner-npv-val { font-family: monospace; font-size: 30px; font-weight: 700; margin-top: 3px; }
.banner.positive .banner-npv-val { color: #2E7D52; }
.banner.negative .banner-npv-val { color: #C84B31; }
.metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
.metric { background: white; border: 1px solid #E2E6EC; border-radius: 8px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.metric-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #8A96A6; margin-bottom: 7px; }
.metric-val { font-family: monospace; font-size: 18px; font-weight: 700; }
.metric-val.ok { color: #2E7D52; }
.metric-val.bad { color: #C84B31; }
.metric-sub { font-size: 10px; color: #8A96A6; margin-top: 3px; }
.charts{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.chart-box { background: white; border: 1px solid #E2E6EC; border-radius: 8px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.chart-title { font-size: 14px; font-weight: 700; color: #4A5568; margin-bottom: 10px; }
.collapsible { background: white; border: 1px solid #E2E6EC; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 14px; overflow: hidden; }
.coll-head { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.coll-head:hover { background: #F7F8FA; }
.coll-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #4A5568; }
.coll-arr { color: #8A96A6; font-size: 15px; transition: transform 0.2s; }
.coll-body { display: none; border-top: 1px solid #E2E6EC; }
.coll-body.open { display: block; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { padding: 8px 14px; text-align: right; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #8A96A6; border-bottom: 1px solid #E2E6EC; white-space: nowrap; background: #F7F8FA; }
td { padding: 8px 14px; text-align: right; font-family: monospace; color: #0F1D2E; border-bottom: 1px solid #E2E6EC; }
td.label-cell { text-align: left; font-family: inherit; color: #0F1D2E; }
td.sub-cell { text-align: left; font-family: inherit; color: #8A96A6; font-size: 11px; }
td.neg { color: #C84B31; }
tr.total-row td { font-weight: 700; background: #F7F8FA; }
tr.npv-row td { font-size: 15px; font-weight: 800; border-top: 2px solid #1B3F6E; }
tr.npv-row.ok td { background: rgba(46,125,82,0.09); color: #2E7D52; }
tr.npv-row.bad td { background: rgba(200,75,49,0.06); color: #C84B31; }
tr:nth-child(even) { background: #F7F8FA; }
.overflow-x { overflow-x: auto; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,29,46,0.82); z-index: 9999; display: flex; align-items: center; justify-content: center; }
.modal-box { background: white; border-radius: 10px; overflow: hidden; width: min(820px, 95vw); }
.modal-head { padding: 11px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E6EC; }
.modal-head span { font-size: 13px; font-weight: 700; color: #4A5568; }
.modal-close { background: none; border: none; font-size: 22px; color: #8A96A6; cursor: pointer; line-height: 1; }



/* Test Panel */

/* ── PRINT ───────────────────────────────────────────────────────────────── */
.print-btn {
  display: flex; align-items: center; gap: 6px;
  background: transparent; color: #4A5568; border: 1.5px solid #E2E6EC;
  border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.print-btn:hover { border-color: #1B3F6E; color: #1B3F6E; }


/* ── BENEFIT WIZARD ─────────────────────────────────────────────────────── */
.p2-wizard{background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:10px;margin-bottom:18px;overflow:hidden}
.wizard-toggle{padding:12px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--amber-light);border-bottom:1.5px solid var(--amber)}
.wizard-toggle:hover{background:#FDE68A}
.wizard-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.wizard-row{display:flex;flex-direction:column;gap:6px}
.wizard-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-dark)}
.wizard-result{background:var(--green-soft);border:1px solid var(--green);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wizard-use{background:var(--green);color:white;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
/* ── SENSITIVITY INDICATOR ──────────────────────────────────────────────── */
.sens-indicator{border-radius:8px;padding:14px 18px;margin-bottom:18px;border:1.5px solid transparent}
.si-positive{background:var(--green-soft);border-color:var(--green)}
.si-negative{background:rgba(200,75,49,.07);border-color:var(--warn)}
.si-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.si-positive .si-title{color:var(--green)}
.si-negative .si-title{color:var(--warn)}
.si-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.si-item{display:flex;flex-direction:column;gap:3px}
.si-label{font-size:11px;color:var(--t2)}
.si-val{font-family:monospace;font-size:20px;font-weight:800}
.si-val.ok{color:var(--green)}.si-val.bad{color:var(--warn)}

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var S = {
  page: 1,
  currency: "USD",
  cur_open: false,
  coc_open:false,coc_eq_mode:"gordon",coc_kd:6,coc_tax:35,coc_div:0,coc_price:0,coc_g:5,coc_rf:4.5,coc_beta:1.0,coc_mrp:5.5,coc_wd:50,
  show_dcf: false,
  show_table: false,
  res_tab: 0,
  show_all: false,
  res: null,
  // inputs — blank by default; user fills these in
  cost: "", itcPct: "", life: "", salvage: "",
  method: "Double-declining", hyr: true, ddbRate: "",
  workingCapital: "", annuity: true, annuityAmount: "",
  yearlyBenefits: [],
  taxRate: "", coc: "",
  // benefit wizard state
  bw_open: false, bw_type: "cost_saving", bw_current: "", bw_improvement: "",
  show_reverse: false
};

var CURRENCIES = [
  {code:"USD",symbol:"$",label:"US Dollar"},
  {code:"EUR",symbol:"€",label:"Euro"},
  {code:"JPY",symbol:"¥",label:"Japanese Yen"},
  {code:"GBP",symbol:"£",label:"British Pound"},
  {code:"INR",symbol:"₹",label:"Indian Rupee"},
  {code:"CHF",symbol:"CHF",label:"Swiss Franc"},
  {code:"CAD",symbol:"CA$",label:"Canadian Dollar"},
  {code:"AUD",symbol:"AU$",label:"Australian Dollar"},
  {code:"NZD",symbol:"NZ$",label:"New Zealand Dollar"}
];

function getSym() {
  var c = CURRENCIES.find(function(c){return c.code===S.currency;});
  return c ? c.symbol : "$";
}

// ── FORMAT ───────────────────────────────────────────────────────────────────
function fmt(n, d) {
  if (n == null || isNaN(n)) return "--";
  d = d || 0;
  return n.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtM(n) {
  if (n == null || isNaN(n)) return "--";
  var s = getSym();
  return n < 0 ? "-" + s + fmt(Math.abs(n)) : s + fmt(n);
}
function fmtPct(n) { return isNaN(n) ? "--" : fmt(n * 100, 2) + "%"; }

// ── CALC ─────────────────────────────────────────────────────────────────────
function calcDepr(cost, itcPct, life, method, hyr, ddbRate) {
  var base = cost - cost * itcPct / 100;
  var d = [];
  if (method === "Double-declining") {
    var rate = ddbRate / 100;
    d.push(base * rate * (hyr ? 0.5 : 1));
    for (var y = 2; y <= life; y++) {
      var prev = d.reduce(function(s,v){return s+v;}, 0);
      d.push((base - prev) * rate);
    }
  } else if (method === "Straight-line") {
    var y1 = base / life * (hyr ? 0.5 : 1);
    d.push(y1);
    for (var y = 2; y <= life; y++) d.push(hyr ? (base - y1) / (life - 1) : base / life);
  } else {
    var y1 = hyr ? base/(life+1) : 2*base/(life+1);
    d.push(y1);
    if (hyr) for (var y=2;y<=life;y++) d.push(2*base*(life-y+1)/((life+1)*(life-1)));
    else      for (var y=2;y<=life;y++) d.push(base*(life-y+1)*2/(life*(life+1)));
  }
  return d;
}

function calcAll() {
  var cost=+S.cost, itcPct=+S.itcPct, life=+S.life||10, salvage=+S.salvage,
      ddbRate=+S.ddbRate, tx=S.taxRate/100, r=S.coc/100, wc=+S.workingCapital;
  var itc = cost * itcPct / 100;
  var ben = [];
  for (var i = 0; i < life; i++)
    ben.push(S.annuity ? (S.annuityAmount||0) : (S.yearlyBenefits[i]||0));
  var depr = calcDepr(cost, itcPct, life, S.method, S.hyr, ddbRate);
  var rows = [];
  for (var i = 0; i < life; i++) {
    var yr=i+1, btBen=ben[i], atBen=btBen*(1-tx),
        btDepr=depr[i], atShield=btDepr*tx,
        itcYr=(yr===1?itc:0),
        totalAT=atBen+atShield+itcYr, pvAtBen=atBen/Math.pow(1+r,yr);
    rows.push({yr:yr,btBen:btBen,atBen:atBen,btDepr:btDepr,atShield:atShield,itcYr:itcYr,totalAT:totalAT,pvAtBen:pvAtBen});
  }
  var pvOut=cost+wc, pvBen=rows.reduce(function(s,row){return s+row.pvAtBen;},0);
  var pvITC=itc/(1+r), pvS1=depr.length>0?depr[0]*tx/(1+r):0;
  var pvS2=0; for(var i=1;i<rows.length;i++) pvS2+=rows[i].atShield/Math.pow(1+r,i+1);
  var pvShield=pvS1+pvS2, pvSalv=salvage/Math.pow(1+r,life);
  var pvLoss=-(salvage*tx)/Math.pow(1+r,life), pvWC=wc/Math.pow(1+r,life);
  var pvIn=pvBen+pvITC+pvShield+pvSalv+pvLoss+pvWC, npv=pvIn-pvOut;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life, anpv=af>0?npv/af:0, bc=pvOut>0?pvIn/pvOut:0;

  function npvR(rate) {
    var cfs=[-pvOut];
    for(var i=0;i<life;i++){
      var yr=i+1,cf=ben[i]*(1-tx)+depr[i]*tx;
      if(yr===1)cf+=itc; if(yr===life)cf+=salvage*(1-tx)+wc; cfs.push(cf);
    }
    return cfs.reduce(function(s,cf,i){return s+cf/Math.pow(1+rate,i);},0);
  }
  var irr=0.1;
  for(var i=0;i<100;i++){
    var f=npvR(irr),df=(npvR(irr+0.0001)-f)/0.0001;
    if(Math.abs(df)<1e-10)break;
    var nx=irr-f/df; if(Math.abs(nx-irr)<1e-8){irr=nx;break;}
    irr=nx; if(irr<-0.99||irr>100){irr=NaN;break;}
  }
  var payback=null,cum=-pvOut;
  for(var i=0;i<rows.length;i++){
    var prev=cum; cum+=rows[i].totalAT;
    if(cum>=0&&prev<0){payback=i+(Math.abs(prev)/(Math.abs(prev)+cum));break;}
  }
  var pcts=[-30,-20,-10,0,10,20,30];
  var cocSens=pcts.map(function(p){
    var tc=S.coc*(1+p/100),tr=tc/100,taf=tr>0?(1-Math.pow(1+tr,-life))/tr:life;
    var tpb=S.annuity?(S.annuityAmount*(1-tx)*taf):rows.reduce(function(s,row,i){return s+row.atBen/Math.pow(1+tr,i+1);},0);
    var tps=rows.reduce(function(s,row,i){return s+row.atShield/Math.pow(1+tr,i+1);},0);
    return{label:tc.toFixed(1)+"%",npv:tpb+itc/(1+tr)+tps+salvage*(1-tx)/Math.pow(1+tr,life)+wc/Math.pow(1+tr,life)-pvOut};
  });
  var base2=S.annuity?S.annuityAmount:(ben.reduce(function(s,b){return s+b;},0)/Math.max(life,1));
  var benSens=pcts.map(function(p){
    var tb=base2*(1+p/100);
    var tpb=S.annuity?tb*(1-tx)*af:rows.reduce(function(s,_,i){return s+(ben[i]*(1+p/100)*(1-tx))/Math.pow(1+r,i+1);},0);
    return{label:"$"+Math.round(tb/1000)+"k",npv:tpb+pvITC+pvShield+pvSalv+pvLoss+pvWC-pvOut};
  });
  return{rows:rows,depr:depr,pvOut:pvOut,pvBen:pvBen,pvITC:pvITC,pvS1:pvS1,pvS2:pvS2,
    pvShield:pvShield,pvSalv:pvSalv,pvLoss:pvLoss,pvWC:pvWC,pvIn:pvIn,
    npv:npv,anpv:anpv,bc:bc,irr:irr,payback:payback,af:af,cocSens:cocSens,benSens:benSens,
    itc:itc,annAmt:S.annuity?S.annuityAmount:null};
}


// ── BREAK-EVEN BENEFIT ────────────────────────────────────────────────────────
function calcBreakEven() {
  // Solve for the constant annual benefit where NPV = 0
  // NPV = pvBen + pvFixed - pvOut = 0
  // pvBen = benefit*(1-tx)*AF
  // => benefit = (pvOut - pvFixed) / ((1-tx)*AF)
  var cost=+S.cost, itcPct=+S.itcPct, life=+S.life||1, salvage=+S.salvage,
      ddbRate=+S.ddbRate, tx=S.taxRate/100, r=S.coc/100, wc=+S.workingCapital;
  var itc=cost*itcPct/100;
  var depr=calcDepr(cost,itcPct,life,S.method,S.hyr,ddbRate);
  var pvOut=cost+wc;
  var pvITC=itc/(1+r);
  var pvS1=depr.length>0?depr[0]*tx/(1+r):0;
  var pvS2=0; for(var i=1;i<depr.length;i++) pvS2+=depr[i]*tx/Math.pow(1+r,i+1);
  var pvSalv=salvage/Math.pow(1+r,life);
  var pvLoss=-(salvage*tx)/Math.pow(1+r,life);
  var pvWC=wc/Math.pow(1+r,life);
  var pvFixed=pvITC+pvS1+pvS2+pvSalv+pvLoss+pvWC;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  return (pvOut-pvFixed)/((1-tx)*af);
}

// ── CURRENCY ─────────────────────────────────────────────────────────────────
function toggleCur() {
  S.cur_open = !S.cur_open;
  var dd = document.getElementById("cur-dropdown");
  if (S.cur_open) {
    dd.innerHTML = "";
    CURRENCIES.forEach(function(c) {
      var b = document.createElement("button");
      b.innerHTML = '<span class="sym">'+c.symbol+'</span>'+c.label;
      b.onclick = function(){ S.currency=c.code; S.cur_open=false; render(); };
      dd.appendChild(b);
    });
    dd.classList.add("open");
  } else {
    dd.classList.remove("open");
  }
}

// ── STEPPER ───────────────────────────────────────────────────────────────────
function updateStepper() {
  for (var i = 1; i <= 3; i++) {
    var step = document.getElementById("step"+i);
    var sn = document.getElementById("sn"+i);
    step.className = "step";
    if (i < S.page) { step.classList.add("done"); sn.textContent = "✓"; }
    else if (i === S.page) { step.classList.add("active"); sn.textContent = String(i); }
    else { sn.textContent = String(i); }
  }
  for (var i = 1; i <= 3; i++) {
    var step = document.getElementById("step"+i);
    var n = i;
    step.style.cursor = (n < S.page || (n===3&&S.res)) ? "pointer" : "default";
    (function(n,step){ step.onclick = function(){
      if(n < S.page || (n===3&&S.res)){ S.page=n; render(); }
    };})(n,step);
  }
}

// ── CANVAS CHART ─────────────────────────────────────────────────────────────
function drawChart(canvasId, data, xLabel) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var fresh=canvas.cloneNode(true);canvas.parentNode.replaceChild(fresh,canvas);canvas=fresh;
  var ctx = canvas.getContext('2d');
  var W=canvas.width, H=canvas.height;
  var pad={top:16,bottom:50,left:64,right:8};
  var cw=W-pad.left-pad.right, ch=H-pad.top-pad.bottom;
  // Support both {npv} and {rate} as the y value
  var yKey=data[0]&&data[0].npv!==undefined?'npv':'rate';
  var vals=data.map(function(d){return d[yKey];});
  var maxV=Math.max.apply(null,vals.map(Math.abs))||1;
  var hasNeg=vals.some(function(v){return v<0;});
  var lo=hasNeg?-maxV*1.2:0, hi=maxV*1.2;
  var rng=hi-lo;
  var gap=cw/data.length, bw=Math.floor(gap*0.6);
  var midIdx=Math.floor(data.length/2);
  function toY(v){return pad.top+ch*(hi-v)/rng;}
  var zeroY=toY(0);
  function drawBase(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#E2E6EC'; ctx.lineWidth=1;
    var steps=4;
    for(var i=0;i<=steps;i++){
      var y=pad.top+(ch/steps)*i;
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cw,y); ctx.stroke();
      var v=hi-rng*(i/steps);
      ctx.fillStyle='#8A96A6'; ctx.font='10px system-ui'; ctx.textAlign='right';
      ctx.fillText(Math.round(v/1000)+'k',pad.left-3,y+3);
    }
    ctx.strokeStyle='#C8D0DA'; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(pad.left,zeroY); ctx.lineTo(pad.left+cw,zeroY); ctx.stroke();
    ctx.setLineDash([]);
    data.forEach(function(d,i){
      var yv=d[yKey];
      var x=pad.left+gap*i+(gap-bw)/2;
      var y0=zeroY, y1=toY(yv), barH=Math.abs(y1-y0), top=Math.min(y0,y1);
      ctx.fillStyle=yv>=0?(i===midIdx?'#2E7D52':'#6DBF8A'):(i===midIdx?'#C84B31':'#E88A8A');
      ctx.fillRect(x,top,bw,Math.max(barH,1));
      ctx.fillStyle=i===midIdx?'#1B3F6E':'#8A96A6';
      ctx.font=(i===midIdx?'bold ':'')+'10px system-ui'; ctx.textAlign='center';
      ctx.fillText(d.label||String(i),x+bw/2,H-pad.bottom+14);
    });
    ctx.strokeStyle='#4A5568'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pad.left,pad.top); ctx.lineTo(pad.left,pad.top+ch); ctx.lineTo(pad.left+cw,pad.top+ch); ctx.stroke();
    ctx.fillStyle='#4A5568'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(xLabel,pad.left+cw/2,H-4);
  }
  function drawTooltip(i){
    var d=data[i], yv=d[yKey];
    var x=pad.left+gap*i+(gap-bw)/2+bw/2, y=toY(yv);
    ctx.strokeStyle='rgba(27,63,110,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.moveTo(x,pad.top); ctx.lineTo(x,pad.top+ch); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#1B3F6E'; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    var xLbl=d.label||String(i);
    var yLbl=(yv>=0?'':'-')+'$'+Math.round(Math.abs(yv)/1000)+'k';
    var text=xLbl+' \u2192 '+yLbl;
    ctx.font='bold 11px system-ui';
    var tw=ctx.measureText(text).width+16, th=22, r2=4;
    var tx=Math.min(Math.max(x-tw/2,pad.left),pad.left+cw-tw);
    var ty=y-th-8; if(ty<pad.top)ty=y+8;
    ctx.fillStyle='rgba(15,29,46,0.88)';
    ctx.beginPath(); ctx.moveTo(tx+r2,ty); ctx.lineTo(tx+tw-r2,ty); ctx.arcTo(tx+tw,ty,tx+tw,ty+r2,r2);
    ctx.lineTo(tx+tw,ty+th-r2); ctx.arcTo(tx+tw,ty+th,tx+tw-r2,ty+th,r2);
    ctx.lineTo(tx+r2,ty+th); ctx.arcTo(tx,ty+th,tx,ty+th-r2,r2);
    ctx.lineTo(tx,ty+r2); ctx.arcTo(tx,ty,tx+r2,ty,r2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='white'; ctx.textAlign='left'; ctx.fillText(text,tx+8,ty+15);
  }
  function hitIdx(cx){
    var rect=canvas.getBoundingClientRect(), scaleX=canvas.width/rect.width;
    var px=(cx-rect.left)*scaleX;
    if(px<pad.left||px>pad.left+cw)return -1;
    return Math.max(0,Math.min(data.length-1,Math.floor((px-pad.left)/gap)));
  }
  canvas.addEventListener('mousemove',function(e){drawBase();var i=hitIdx(e.clientX);if(i>=0)drawTooltip(i);});
  canvas.addEventListener('mouseleave',function(){drawBase();});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];drawBase();var i=hitIdx(t.clientX);if(i>=0)drawTooltip(i);},{passive:false});
  canvas.addEventListener('touchend',function(){drawBase();});
  drawBase();
}

// ── BRIEFING NOTES ────────────────────────────────────────────────────────────
var NOTES1 = [
  {q:"How do I estimate economic life and salvage value?",a:"Economic life is how long the asset will be useful — not its physical life. Salvage value is what you expect to sell it for at the end. Conservative estimates are recommended."},
  {q:"What is ITC and do I qualify?",a:"Investment Tax Credit is a direct reduction in tax payable. Eligibility depends on jurisdiction and asset type. If uncertain, leave this at 0%."},
  {q:"What is the half-year convention?",a:"It assumes all assets placed in service during the year were placed in service at the mid-point, halving the first year depreciation deduction."},
  {q:"Depreciation method",a:"The model calculates depreciation on an asset-by-asset basis using declining-balance, straight-line, or sum-of-years-digits methods. If your jurisdiction uses a pooling system, results will be approximate."}

function makeBriefingList(notes, containerId) {
  var list = document.getElementById(containerId);
  if (!list) return;
  list.innerHTML = "";
  notes.forEach(function(n, i) {
    var item = document.createElement("div");
    item.className = "bn-item";
    var head = document.createElement("div");
    head.className = "bn-head";
    head.innerHTML = '<div class="bn-qmark">?</div><div class="bn-q">'+n.q+'</div><div class="bn-arr" id="arr'+containerId+i+'">›</div>';
    var body = document.createElement("div");
    body.className = "bn-body";
    body.id = "body"+containerId+i;
    body.textContent = n.a;
    if (n.v) {
      var vbtn = document.createElement("button");
      vbtn.className = "watch-btn";
      vbtn.textContent = "▶ Learn More";
      vbtn.onclick = function(e){ e.stopPropagation(); openVideo(n.v); };
      body.appendChild(vbtn);
    }
    head.onclick = function(){
      var isOpen = body.classList.contains("open");
      body.classList.toggle("open");
      document.getElementById("arr"+containerId+i).style.transform = isOpen ? "rotate(0deg)" : "rotate(90deg)";
      head.style.background = isOpen ? "" : "#F7F8FA";
    };
    item.appendChild(head); item.appendChild(body);
    list.appendChild(item);
  });
}


// ── CoC CALCULATOR ────────────────────────────────────────────────────────────
function renderCoC(){
  var box=document.getElementById('coc-box');if(!box)return;box.innerHTML='';

  // ── Collapsed button ──
  if(!S.coc_open){
    box.innerHTML='<button onclick="S.coc_open=true;renderCoC()" style="display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:none;cursor:pointer;text-align:left"><div style="width:34px;height:34px;background:var(--green-soft);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2"/></svg></div><div><div style="font-size:13px;font-weight:700;color:var(--blue)">Cost of Capital Calculator</div><div style="font-size:11px;color:var(--t3);margin-top:2px">After-tax debt · Cost of equity · WACC</div></div><span style="margin-left:auto;color:var(--t3)">›</span></button>';
    return;
  }

  // ── Calculations ──
  var kd_at = +(S.coc_kd*(1-S.coc_tax/100)).toFixed(2);
  var ke_gordon = S.coc_price>0 ? +((S.coc_div/S.coc_price*100)+S.coc_g).toFixed(2) : 0;
  var ke_capm   = +(S.coc_rf+S.coc_beta*S.coc_mrp).toFixed(2);
  var ke        = S.coc_eq_mode==='gordon' ? ke_gordon : ke_capm;
  var we        = Math.max(0,100-S.coc_wd);
  var wacc      = +(kd_at*S.coc_wd/100 + ke*we/100).toFixed(2);

  function tip(t){return '<div style="font-size:10px;color:var(--t3);line-height:1.5;margin-top:3px;font-style:italic">'+t+'</div>';}
  function row(label,key,val,suffix,tipText,readOnly){
    var input=readOnly
      ? '<span style="font-family:monospace;font-size:15px;font-weight:700;color:var(--blue)">'+val+(suffix?'&thinsp;'+suffix:'')+'</span>'
      : '<div class="ui"><input type="text" value="'+val+'" onchange="S.'+key+'=+this.value||0;renderCoC()" style="font-family:monospace;font-size:15px;font-weight:600;border:none;border-bottom:2px solid var(--border);background:transparent;width:100%;outline:none;padding:2px 0">'+(suffix?'<span style="font-size:12px;color:var(--t3)">'+suffix+'</span>':'')+'</div>';
    return '<div style="margin-bottom:12px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:4px">'+label+'</div>'+input+(tipText?tip(tipText):'')+'</div>';
  }
  function sectionHead(n,title,color){
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><div style="width:20px;height:20px;border-radius:50%;background:'+color+';color:white;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</div><div style="font-size:12px;font-weight:700;color:var(--t1)">'+title+'</div></div>';
  }
  function result(label,val,suffix){
    return '<div style="background:var(--surface);border-radius:6px;padding:8px 10px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:var(--t2)">'+label+'</span><span style="font-family:monospace;font-size:15px;font-weight:700;color:var(--blue)">'+val+(suffix?'&thinsp;'+suffix:'')+'</span></div>';
  }

  var html='<div style="border:1px solid var(--blue);border-radius:10px;overflow:hidden">';
  html+='<div style="background:var(--blue);padding:11px 14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:700;color:white">Cost of Capital Calculator</span><button onclick="S.coc_open=false;renderCoC()" style="color:rgba(255,255,255,.7);background:none;border:none;font-size:20px;cursor:pointer;line-height:1">×</button></div>';
  html+='<div style="padding:14px">';

  // ── Section 1: After-tax cost of borrowing ──
  html+=sectionHead(1,'After-tax cost of borrowing','var(--blue)');
  html+=row('Interest rate on your debt','coc_kd',S.coc_kd,'%','The annual rate your bank or lender charges on loans or lines of credit.');
  html+=row('Your business tax rate','coc_tax',S.coc_tax,'%','Because interest payments are tax-deductible, the government covers part of your borrowing cost. Your true cost is the interest rate minus the tax saving.');
  html+=result('After-tax cost of borrowing',kd_at,'%');

  // ── Section 2: Cost of equity ──
  html+=sectionHead(2,'Cost of equity','#9F7AEA');
  // Toggle Gordon / CAPM
  html+='<div style="display:flex;gap:6px;margin-bottom:12px">';
  ['gordon','capm'].forEach(function(m,i){
    var active=S.coc_eq_mode===m;
    var label=m==='gordon'?'Growth model':'CAPM';
    var sub=m==='gordon'?'Dividend / earnings growth':'Market risk';
    html+='<button onclick="S.coc_eq_mode=\''+m+'\';renderCoC()" style="flex:1;padding:7px 8px;border-radius:7px;border:1.5px solid '+(active?'var(--blue)':'var(--border)')+';background:'+(active?'var(--blue-soft)':'transparent')+';cursor:pointer;text-align:left"><div style="font-size:11px;font-weight:700;color:'+(active?'var(--blue)':'var(--t2)')+'">'+label+'</div><div style="font-size:10px;color:var(--t3)">'+sub+'</div></button>';
  });
  html+='</div>';

  if(S.coc_eq_mode==='gordon'){
    html+=row('Expected dividend or profit distribution next year ($)','coc_div',S.coc_div,'$','The cash you expect to pay out to owners or shareholders in the coming year. For an owner-managed business, this is the return you expect to take out.');
    html+=row('Current value of the business ($)','coc_price',S.coc_price,'$','What the business is worth today — the price a willing buyer would pay. If you are unsure, use book value or a recent valuation.');
    html+=row('Expected annual growth rate of the firm','coc_g',S.coc_g,'%','How fast do you expect revenues and earnings to grow each year? A stable, mature business might use 2–3%. A growing business might use 5–8%.');
    var formula=S.coc_price>0?'('+S.coc_div+' ÷ '+S.coc_price+' × 100) + '+S.coc_g+'% growth':'Enter a business value above';
    html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: (annual distribution ÷ business value) + growth rate &nbsp;→&nbsp; '+formula+'</div>';
  } else {
    html+=row('Risk-free rate','coc_rf',S.coc_rf,'%','The return on a risk-free investment such as a government bond. Use the current rate on a 10-year government bond.');
    html+=row('Beta (business risk factor)','coc_beta',S.coc_beta,'','A measure of how risky your business is relative to the overall market. 1.0 = average market risk. Higher values mean more risk. Most small businesses fall between 0.8 and 1.5.');
    html+=row('Market risk premium','coc_mrp',S.coc_mrp,'%','The extra return investors demand for taking on business risk rather than holding safe government bonds. Typically 5–6% for most markets.');
    html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: risk-free rate + (beta × market risk premium) = '+S.coc_rf+' + ('+S.coc_beta+' × '+S.coc_mrp+')</div>';
  }
  html+=result('Cost of equity',ke,'%');

  // ── Section 3: Overall cost of capital ──
  html+=sectionHead(3,'Overall cost of capital (WACC)','var(--green)');
  html+='<div style="background:var(--surface);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:11px;color:var(--t2)">Carried from above — after-tax cost of borrowing <strong>'+kd_at+'%</strong>, cost of equity <strong>'+ke+'%</strong></div>';
  html+=row('Debt as % of total financing','coc_wd',S.coc_wd,'%','What proportion of your business is funded by loans vs. owner investment? For example, if you borrowed $60 of every $100 invested, enter 60.');
  html+='<div style="font-size:11px;color:var(--t3);margin-bottom:10px">Equity portion: '+(100-S.coc_wd)+'%</div>';
  html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: ('+kd_at+'% × '+S.coc_wd+'%) + ('+ke+'% × '+we+'%) = '+wacc+'%</div>';

  // ── Final result ──
  html+='<div style="margin-top:4px;padding:12px 14px;background:var(--green-soft);border-radius:8px;border:1px solid var(--green);display:flex;justify-content:space-between;align-items:center">';
  html+='<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--green)">Cost of Capital</div><div style="font-family:monospace;font-size:24px;font-weight:700;color:var(--green)">'+wacc+'%</div></div>';
  html+='<button onclick="S.coc='+wacc+';S.coc_open=false;renderCoC();var el=document.getElementById(\'inp-coc\');if(el){el.value='+wacc+';}" style="background:var(--green);color:white;border:none;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer">Use this rate →</button>';
  html+='</div>';

  html+='</div></div>';
  box.innerHTML=html;
}

function field(label, inputHtml, fullWidth, last) {

function uInput(prefix, value, id, stateKey, suffix) {
  var html = '<div class="underline-input">';
  if (prefix) html += '<span class="pfx">'+prefix+'</span>';
  html += '<input type="text" id="'+id+'" value="'+value+'" '
    + 'onblur="S.'+stateKey+'=isNaN(+this.value)?S.'+stateKey+':(+this.value);document.getElementById(\'cur-label\').textContent=getSym()+\' \'+S.currency" '
    + 'onfocus="this.style.borderBottomColor=\'#1B3F6E\'" '
    + 'onblur2="this.style.borderBottomColor=\'#E2E6EC\'">';
  if (suffix) html += '<span class="sfx">'+suffix+'</span>';
  html += '</div>';
  return html;
}

function goToPage2() {
  var missing = [];
  if (S.cost === "" || S.cost == null) missing.push("Cost of Asset");
  if (S.itcPct === "" || S.itcPct == null) missing.push("Investment Tax Credit");
  if (S.life === "" || S.life == null) missing.push("Economic Life");
  if (S.salvage === "" || S.salvage == null) missing.push("Salvage Value");
  if (S.workingCapital === "" || S.workingCapital == null) missing.push("Working Capital Required");
  if (S.method === "Double-declining" && (S.ddbRate === "" || S.ddbRate == null)) missing.push("Depreciation Rate");
  if (S.taxRate === "" || S.taxRate == null) missing.push("Tax Rate");
  if (S.coc === "" || S.coc == null) missing.push("Required Rate of Return");

  if (missing.length > 0) {
    S.missingFields = missing;
    render();
    return;
  }
  S.missingFields = null;
  S.page = 2;
  render();
}

function updateWizard() {
  // Update wizard result div live without full re-render
  var res = document.getElementById('bw-result');
  if (!res) return;
  var suggested = S.bw_type === 'both'
    ? (S.bw_current ? Math.round(S.bw_current) : 0)
    : (S.bw_current && S.bw_improvement ? Math.round(S.bw_current * S.bw_improvement / 100) : 0);
  if (suggested > 0) {
    res.style.display = 'flex';
    var lbl = res.querySelector('#bw-lbl');
    if (lbl) lbl.textContent = getSym() + fmt(suggested, 0);
    var btn = res.querySelector('.wizard-use');
    if (btn) btn.onclick = function() {
      if (!S.annuity && S.annuityAmount > 0) { S.yearlyBenefits[0] = suggested; }
      S.annuity = true; S.annuityAmount = suggested; S.bw_open = false; render();
    };
  } else {
    res.style.display = 'none';
  }
}

function updateYB(idx, val) {
  while (S.yearlyBenefits.length <= idx) S.yearlyBenefits.push(0);
  S.yearlyBenefits[idx] = val;
}


function validateInputs(){
  var errs=[];
  if(+S.cost<=0) errs.push("Asset cost must be greater than zero");
  if(+S.life<=0) errs.push("Asset life must be greater than zero");
  if(S.salvage!==''&&+S.salvage<0) errs.push("Salvage value cannot be negative");
  if(S.salvage!==''&&S.cost!==''&&+S.salvage>=+S.cost) errs.push("Salvage cannot equal or exceed the asset cost");
  if(S.method==="Double-declining"&&!(+S.ddbRate>0)) errs.push("Depreciation rate must be greater than zero for double-declining method");
  if(+S.taxRate<0||+S.taxRate>=100) errs.push("Tax rate must be between 0 and 100");
  if(+S.coc<=0) errs.push("Required return must be greater than zero");
  if(+S.coc>=100) errs.push("Required return cannot equal or exceed 100%");
  return errs;
}
function runCalc() {
  var valErrs=validateInputs();if(valErrs.length>0){S.missingFields=valErrs;render();return;}
  try { S.res = calcAll(); S.page = 3; render(); }
  catch(e) { console.error(e); alert("Calculation error: "+e.message); }
}

// ── Storage: localStorage primary, IndexedDB secondary ───────────────────
var IDB_NAME='capplan';
var IDB_STORE='analyses';
var IDB_MODEL='M1';
var LS_STORE_KEY='capplan_m1_analyses';  // stores all named analyses
var _idb=null;

// localStorage helpers
function lsGetAll(){
  if(!LS_OK)return [];
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    var rows=[];
    Object.keys(obj).forEach(function(k){rows.push(obj[k]);});
    rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
    return rows;
  }catch(e){return [];}
}

function lsSave(payload){
  if(!LS_OK)return false;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    obj[payload.label]=payload;
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
    console.log('[CapPlan] lsSave: saved label='+payload.label+' total='
      +Object.keys(obj).length);
    return true;
  }catch(e){console.error('[CapPlan] lsSave error',e);return false;}
}

function lsLoad(label){
  if(!LS_OK)return null;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    return obj[label]||null;
  }catch(e){return null;}
}

function lsDelete(label){
  if(!LS_OK)return;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    delete obj[label];
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
  }catch(e){}
}

// IndexedDB (used when deployed to a persistent origin)
function openIDB(cb){
  if(_idb){return cb(_idb);}
  var req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE)){
      db.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true});
    }
  };
  req.onsuccess=function(e){
    _idb=e.target.result;
    console.log('[CapPlan] openIDB: success, stores:',Array.from(_idb.objectStoreNames));
    cb(_idb);
  };
  req.onerror=function(){console.error('[CapPlan] openIDB error');cb(null);};
}

function idbSave(payload,cb){
  openIDB(function(db){
    if(!db)return cb&&cb(null);
    var rtx=db.transaction(IDB_STORE,'readonly');
    var rreq=rtx.objectStore(IDB_STORE).getAll();
    rreq.onsuccess=function(){
      var rows=rreq.result||[];
      var existing=rows.filter(function(r){
        return r.model===IDB_MODEL&&r.label===payload.label;
      });
      if(existing.length)payload.id=existing[0].id;
      var wtx=db.transaction(IDB_STORE,'readwrite');
      var store=wtx.objectStore(IDB_STORE);
      if(existing.length){
        store.put(payload);
      } else {
        store.add(payload);
      }
      wtx.oncomplete=function(){
        cb&&cb(true);
      };
      wtx.onerror=function(){console.error('[CapPlan] idbSave tx error');cb&&cb(false);};
    };
    rreq.onerror=function(){
      var wtx=db.transaction(IDB_STORE,'readwrite');
      wtx.objectStore(IDB_STORE).add(payload);
      wtx.oncomplete=function(){cb&&cb(true);};
    };
  });
}

function idbGetAll(cb){
  openIDB(function(db){
    if(!db)return cb([]);
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=function(){
      var all=req.result||[];
      var rows=all.filter(function(r){return r.model===IDB_MODEL;});
      rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
      cb(rows);
    };
    req.onerror=function(){console.error('[CapPlan] idbGetAll error');cb([]);};
  });
}

function idbDelete(id,label,cb){
  lsDelete(label);
  openIDB(function(db){
    if(!db)return cb&&cb();
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=function(){cb&&cb();};
  });
}

// Primary save: localStorage. Secondary: IndexedDB.
function storeSave(payload,cb){
  var lsOk=lsSave(payload);
  idbSave(payload,function(idbOk){
    cb&&cb(lsOk||idbOk);
  });
}

// Primary read: localStorage (reliable on localhost).
// Falls back to IndexedDB if localStorage is empty.
function storeGetAll(cb){
  var lsRows=lsGetAll();
  if(lsRows.length>0){
    cb(lsRows);
  } else {
    idbGetAll(cb);
  }
}

function autoSave(){
  var payload=buildPayload('\u2605 Last session');

function buildPayload(label){
  var fields=['currency', 'coc_open', 'coc_eq_mode', 'coc_kd', 'coc_tax', 'coc_div', 'coc_price', 'coc_g', 'coc_rf', 'coc_beta', 'coc_mrp', 'coc_wd', 'cost', 'itcPct', 'life', 'salvage', 'method', 'hyr', 'ddbRate', 'workingCapital', 'annuity', 'annuityAmount', 'yearlyBenefits', 'taxRate', 'coc'];
  var st={};fields.forEach(function(k){st[k]=S[k];});
  return {capplan_version:'1.0',model:IDB_MODEL,saved:new Date().toISOString(),
          label:label||'Untitled',state:st};
}

function applyPayload(p){
  if(!p||!p.state)return false;
  Object.keys(p.state).forEach(function(k){if(k in S)S[k]=p.state[k];});
  S.res=null;S.page=1;S.show_dcf=false;S.show_table=false;
  return true;
}

function loadFromIDB(id,label){
  // Try localStorage first (primary store)
  if(label){
    var p=lsLoad(label);
    if(p){
      if(applyPayload(p)){render();closeSLModal();return;}
    }
  }
  // Fall back to IndexedDB
  if(!id){console.error('[CapPlan] loadFromIDB: no id or label found');return;}
  openIDB(function(db){
    if(!db)return;
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).get(id);
    req.onsuccess=function(){
      var p=req.result;
      if(p&&applyPayload(p)){render();closeSLModal();}
    };
  });
}

function deleteFromIDB(id,label){
  idbDelete(id,label,function(){
    loadAnalysis();
  });
}

function handleFileLoad(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(p.model&&p.model!==IDB_MODEL){
        alert('This file is from '+p.model+', not M1. Please load it in the correct model.');return;
      }
      if(applyPayload(p)){
        // also save it into IDB so it appears in the list
        idbSave(p,null);
        render();closeSLModal();
      }
    }catch(err){alert('Could not read file. Please check it is a valid CapPlan JSON file.');}
  };
  reader.readAsText(file);
  event.target.value='';
}

// ── FORMAT ───────────────────────────────────────────────────────────────────
function fmt(n, d) {
  if (n == null || isNaN(n)) return "--";
  d = d || 0;
  return n.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtM(n) {
  if (n == null || isNaN(n)) return "--";
  var s = getSym();
  return n < 0 ? "-" + s + fmt(Math.abs(n)) : s + fmt(n);
}
function fmtPct(n) { return isNaN(n) ? "--" : fmt(n * 100, 2) + "%"; }

// ── CALC ─────────────────────────────────────────────────────────────────────
function calcDepr(cost, itcPct, life, method, hyr, ddbRate) {
  var base = cost - cost * itcPct / 100;
  var d = [];
  if (method === "Double-declining") {
    var rate = ddbRate / 100;
    d.push(base * rate * (hyr ? 0.5 : 1));
    for (var y = 2; y <= life; y++) {
      var prev = d.reduce(function(s,v){return s+v;}, 0);
      d.push((base - prev) * rate);
    }
  } else if (method === "Straight-line") {
    var y1 = base / life * (hyr ? 0.5 : 1);
    d.push(y1);
    for (var y = 2; y <= life; y++) d.push(hyr ? (base - y1) / (life - 1) : base / life);
  } else {
    var y1 = hyr ? base/(life+1) : 2*base/(life+1);
    d.push(y1);
    if (hyr) for (var y=2;y<=life;y++) d.push(2*base*(life-y+1)/((life+1)*(life-1)));
    else      for (var y=2;y<=life;y++) d.push(base*(life-y+1)*2/(life*(life+1)));
  }
  return d;
}

function calcAll() {
  var cost=+S.cost, itcPct=+S.itcPct, life=+S.life||10, salvage=+S.salvage,
      ddbRate=+S.ddbRate, tx=S.taxRate/100, r=S.coc/100, wc=+S.workingCapital;
  var itc = cost * itcPct / 100;
  var ben = [];
  for (var i = 0; i < life; i++)
    ben.push(S.annuity ? (S.annuityAmount||0) : (S.yearlyBenefits[i]||0));
  var depr = calcDepr(cost, itcPct, life, S.method, S.hyr, ddbRate);
  var rows = [];
  for (var i = 0; i < life; i++) {
    var yr=i+1, btBen=ben[i], atBen=btBen*(1-tx),
        btDepr=depr[i], atShield=btDepr*tx,
        itcYr=(yr===1?itc:0),
        totalAT=atBen+atShield+itcYr, pvAtBen=atBen/Math.pow(1+r,yr);
    rows.push({yr:yr,btBen:btBen,atBen:atBen,btDepr:btDepr,atShield:atShield,itcYr:itcYr,totalAT:totalAT,pvAtBen:pvAtBen});
  }
  var pvOut=cost+wc, pvBen=rows.reduce(function(s,row){return s+row.pvAtBen;},0);
  var pvITC=itc/(1+r), pvS1=depr.length>0?depr[0]*tx/(1+r):0;
  var pvS2=0; for(var i=1;i<rows.length;i++) pvS2+=rows[i].atShield/Math.pow(1+r,i+1);
  var pvShield=pvS1+pvS2, pvSalv=salvage/Math.pow(1+r,life);
  var pvLoss=-(salvage*tx)/Math.pow(1+r,life), pvWC=wc/Math.pow(1+r,life);
  var pvIn=pvBen+pvITC+pvShield+pvSalv+pvLoss+pvWC, npv=pvIn-pvOut;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life, anpv=af>0?npv/af:0, bc=pvOut>0?pvIn/pvOut:0;

  function npvR(rate) {
    var cfs=[-pvOut];
    for(var i=0;i<life;i++){
      var yr=i+1,cf=ben[i]*(1-tx)+depr[i]*tx;
      if(yr===1)cf+=itc; if(yr===life)cf+=salvage*(1-tx)+wc; cfs.push(cf);
    }
    return cfs.reduce(function(s,cf,i){return s+cf/Math.pow(1+rate,i);},0);
  }
  var irr=0.1;
  for(var i=0;i<100;i++){
    var f=npvR(irr),df=(npvR(irr+0.0001)-f)/0.0001;
    if(Math.abs(df)<1e-10)break;
    var nx=irr-f/df; if(Math.abs(nx-irr)<1e-8){irr=nx;break;}
    irr=nx; if(irr<-0.99||irr>100){irr=NaN;break;}
  }
  var payback=null,cum=-pvOut;
  for(var i=0;i<rows.length;i++){
    var prev=cum; cum+=rows[i].totalAT;
    if(cum>=0&&prev<0){payback=i+(Math.abs(prev)/(Math.abs(prev)+cum));break;}
  }
  var pcts=[-30,-20,-10,0,10,20,30];
  var cocSens=pcts.map(function(p){
    var tc=S.coc*(1+p/100),tr=tc/100,taf=tr>0?(1-Math.pow(1+tr,-life))/tr:life;
    var tpb=S.annuity?(S.annuityAmount*(1-tx)*taf):rows.reduce(function(s,row,i){return s+row.atBen/Math.pow(1+tr,i+1);},0);
    var tps=rows.reduce(function(s,row,i){return s+row.atShield/Math.pow(1+tr,i+1);},0);
    return{label:tc.toFixed(1)+"%",npv:tpb+itc/(1+tr)+tps+salvage*(1-tx)/Math.pow(1+tr,life)+wc/Math.pow(1+tr,life)-pvOut};
  });
  var base2=S.annuity?S.annuityAmount:(ben.reduce(function(s,b){return s+b;},0)/Math.max(life,1));
  var benSens=pcts.map(function(p){
    var tb=base2*(1+p/100);
    var tpb=S.annuity?tb*(1-tx)*af:rows.reduce(function(s,_,i){return s+(ben[i]*(1+p/100)*(1-tx))/Math.pow(1+r,i+1);},0);
    return{label:"$"+Math.round(tb/1000)+"k",npv:tpb+pvITC+pvShield+pvSalv+pvLoss+pvWC-pvOut};
  });
  return{rows:rows,depr:depr,pvOut:pvOut,pvBen:pvBen,pvITC:pvITC,pvS1:pvS1,pvS2:pvS2,
    pvShield:pvShield,pvSalv:pvSalv,pvLoss:pvLoss,pvWC:pvWC,pvIn:pvIn,
    npv:npv,anpv:anpv,bc:bc,irr:irr,payback:payback,af:af,cocSens:cocSens,benSens:benSens,
    itc:itc,annAmt:S.annuity?S.annuityAmount:null};
}


// ── BREAK-EVEN BENEFIT ────────────────────────────────────────────────────────
function calcBreakEven() {
  // Solve for the constant annual benefit where NPV = 0
  // NPV = pvBen + pvFixed - pvOut = 0
  // pvBen = benefit*(1-tx)*AF
  // => benefit = (pvOut - pvFixed) / ((1-tx)*AF)
  var cost=+S.cost, itcPct=+S.itcPct, life=+S.life||1, salvage=+S.salvage,
      ddbRate=+S.ddbRate, tx=S.taxRate/100, r=S.coc/100, wc=+S.workingCapital;
  var itc=cost*itcPct/100;
  var depr=calcDepr(cost,itcPct,life,S.method,S.hyr,ddbRate);
  var pvOut=cost+wc;
  var pvITC=itc/(1+r);
  var pvS1=depr.length>0?depr[0]*tx/(1+r):0;
  var pvS2=0; for(var i=1;i<depr.length;i++) pvS2+=depr[i]*tx/Math.pow(1+r,i+1);
  var pvSalv=salvage/Math.pow(1+r,life);
  var pvLoss=-(salvage*tx)/Math.pow(1+r,life);
  var pvWC=wc/Math.pow(1+r,life);
  var pvFixed=pvITC+pvS1+pvS2+pvSalv+pvLoss+pvWC;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  return (pvOut-pvFixed)/((1-tx)*af);
}

// ── CANVAS CHART ─────────────────────────────────────────────────────────────
function drawChart(canvasId, data, xLabel) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var fresh=canvas.cloneNode(true);canvas.parentNode.replaceChild(fresh,canvas);canvas=fresh;
  var ctx = canvas.getContext('2d');
  var W=canvas.width, H=canvas.height;
  var pad={top:16,bottom:50,left:64,right:8};
  var cw=W-pad.left-pad.right, ch=H-pad.top-pad.bottom;
  // Support both {npv} and {rate} as the y value
  var yKey=data[0]&&data[0].npv!==undefined?'npv':'rate';
  var vals=data.map(function(d){return d[yKey];});
  var maxV=Math.max.apply(null,vals.map(Math.abs))||1;
  var hasNeg=vals.some(function(v){return v<0;});
  var lo=hasNeg?-maxV*1.2:0, hi=maxV*1.2;
  var rng=hi-lo;
  var gap=cw/data.length, bw=Math.floor(gap*0.6);
  var midIdx=Math.floor(data.length/2);
  function toY(v){return pad.top+ch*(hi-v)/rng;}
  var zeroY=toY(0);
  function drawBase(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#E2E6EC'; ctx.lineWidth=1;
    var steps=4;
    for(var i=0;i<=steps;i++){
      var y=pad.top+(ch/steps)*i;
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cw,y); ctx.stroke();
      var v=hi-rng*(i/steps);
      ctx.fillStyle='#8A96A6'; ctx.font='10px system-ui'; ctx.textAlign='right';
      ctx.fillText(Math.round(v/1000)+'k',pad.left-3,y+3);
    }
    ctx.strokeStyle='#C8D0DA'; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(pad.left,zeroY); ctx.lineTo(pad.left+cw,zeroY); ctx.stroke();
    ctx.setLineDash([]);
    data.forEach(function(d,i){
      var yv=d[yKey];
      var x=pad.left+gap*i+(gap-bw)/2;
      var y0=zeroY, y1=toY(yv), barH=Math.abs(y1-y0), top=Math.min(y0,y1);
      ctx.fillStyle=yv>=0?(i===midIdx?'#2E7D52':'#6DBF8A'):(i===midIdx?'#C84B31':'#E88A8A');
      ctx.fillRect(x,top,bw,Math.max(barH,1));
      ctx.fillStyle=i===midIdx?'#1B3F6E':'#8A96A6';
      ctx.font=(i===midIdx?'bold ':'')+'10px system-ui'; ctx.textAlign='center';
      ctx.fillText(d.label||String(i),x+bw/2,H-pad.bottom+14);
    });
    ctx.strokeStyle='#4A5568'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pad.left,pad.top); ctx.lineTo(pad.left,pad.top+ch); ctx.lineTo(pad.left+cw,pad.top+ch); ctx.stroke();
    ctx.fillStyle='#4A5568'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(xLabel,pad.left+cw/2,H-4);
  }
  function drawTooltip(i){
    var d=data[i], yv=d[yKey];
    var x=pad.left+gap*i+(gap-bw)/2+bw/2, y=toY(yv);
    ctx.strokeStyle='rgba(27,63,110,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.moveTo(x,pad.top); ctx.lineTo(x,pad.top+ch); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#1B3F6E'; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    var xLbl=d.label||String(i);
    var yLbl=(yv>=0?'':'-')+'$'+Math.round(Math.abs(yv)/1000)+'k';
    var text=xLbl+' \u2192 '+yLbl;
    ctx.font='bold 11px system-ui';
    var tw=ctx.measureText(text).width+16, th=22, r2=4;
    var tx=Math.min(Math.max(x-tw/2,pad.left),pad.left+cw-tw);
    var ty=y-th-8; if(ty<pad.top)ty=y+8;
    ctx.fillStyle='rgba(15,29,46,0.88)';
    ctx.beginPath(); ctx.moveTo(tx+r2,ty); ctx.lineTo(tx+tw-r2,ty); ctx.arcTo(tx+tw,ty,tx+tw,ty+r2,r2);
    ctx.lineTo(tx+tw,ty+th-r2); ctx.arcTo(tx+tw,ty+th,tx+tw-r2,ty+th,r2);
    ctx.lineTo(tx+r2,ty+th); ctx.arcTo(tx,ty+th,tx,ty+th-r2,r2);
    ctx.lineTo(tx,ty+r2); ctx.arcTo(tx,ty,tx+r2,ty,r2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='white'; ctx.textAlign='left'; ctx.fillText(text,tx+8,ty+15);
  }
  function hitIdx(cx){
    var rect=canvas.getBoundingClientRect(), scaleX=canvas.width/rect.width;
    var px=(cx-rect.left)*scaleX;
    if(px<pad.left||px>pad.left+cw)return -1;
    return Math.max(0,Math.min(data.length-1,Math.floor((px-pad.left)/gap)));
  }
  canvas.addEventListener('mousemove',function(e){drawBase();var i=hitIdx(e.clientX);if(i>=0)drawTooltip(i);});
  canvas.addEventListener('mouseleave',function(){drawBase();});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];drawBase();var i=hitIdx(t.clientX);if(i>=0)drawTooltip(i);},{passive:false});
  canvas.addEventListener('touchend',function(){drawBase();});
  drawBase();
}

    html+=row('Expected annual growth rate of the firm','coc_g',S.coc_g,'%','How fast do you expect revenues and earnings to grow each year? A stable, mature business might use 2–3%. A growing business might use 5–8%.');
    var formula=S.coc_price>0?'('+S.coc_div+' ÷ '+S.coc_price+' × 100) + '+S.coc_g+'% growth':'Enter a business value above';
    html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: (annual distribution ÷ business value) + growth rate &nbsp;→&nbsp; '+formula+'</div>';
  } else {
    html+=row('Risk-free rate','coc_rf',S.coc_rf,'%','The return on a risk-free investment such as a government bond. Use the current rate on a 10-year government bond.');
    html+=row('Beta (business risk factor)','coc_beta',S.coc_beta,'','A measure of how risky your business is relative to the overall market. 1.0 = average market risk. Higher values mean more risk. Most small businesses fall between 0.8 and 1.5.');
    html+=row('Market risk premium','coc_mrp',S.coc_mrp,'%','The extra return investors demand for taking on business risk rather than holding safe government bonds. Typically 5–6% for most markets.');
    html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: risk-free rate + (beta × market risk premium) = '+S.coc_rf+' + ('+S.coc_beta+' × '+S.coc_mrp+')</div>';
  }
  html+=result('Cost of equity',ke,'%');

  // ── Section 3: Overall cost of capital ──
  html+=sectionHead(3,'Overall cost of capital (WACC)','var(--green)');
  html+='<div style="background:var(--surface);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:11px;color:var(--t2)">Carried from above — after-tax cost of borrowing <strong>'+kd_at+'%</strong>, cost of equity <strong>'+ke+'%</strong></div>';
  html+=row('Debt as % of total financing','coc_wd',S.coc_wd,'%','What proportion of your business is funded by loans vs. owner investment? For example, if you borrowed $60 of every $100 invested, enter 60.');
  html+='<div style="font-size:11px;color:var(--t3);margin-bottom:10px">Equity portion: '+(100-S.coc_wd)+'%</div>';
  html+='<div style="font-size:10px;color:var(--t3);margin-bottom:10px;font-style:italic">Formula: ('+kd_at+'% × '+S.coc_wd+'%) + ('+ke+'% × '+we+'%) = '+wacc+'%</div>';

  // ── Final result ──
  html+='<div style="margin-top:4px;padding:12px 14px;background:var(--green-soft);border-radius:8px;border:1px solid var(--green);display:flex;justify-content:space-between;align-items:center">';
  html+='<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--green)">Cost of Capital</div><div style="font-family:monospace;font-size:24px;font-weight:700;color:var(--green)">'+wacc+'%</div></div>';
  html+='<button onclick="S.coc='+wacc+';S.coc_open=false;renderCoC();var el=document.getElementById(\'inp-coc\');if(el){el.value='+wacc+';}" style="background:var(--green);color:white;border:none;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer">Use this rate →</button>';
  html+='</div>';

  html+='</div></div>';
  box.innerHTML=html;
}

function cocRow(label, key, val, suffix, hint) {
  return '<div class="coc-row"><div class="coc-row-label">'+label+'</div>'
    + '<div class="underline-input"><input type="text" value="'+val+'" style="font-family:monospace;font-size:15px;font-weight:600;border:none;border-bottom:2px solid #E2E6EC;background:transparent;padding:2px 0;outline:none;width:100%" '
    + 'onchange="S.'+key+'=+this.value||0;renderCoC()" onfocus="this.style.borderBottomColor=\'#1B3F6E\'" onblur="this.style.borderBottomColor=\'#E2E6EC\'">'
    + (suffix?'<span style="font-size:13px;color:#8A96A6;flex-shrink:0">'+suffix+'</span>':'')
    + '</div>'
    + (hint?'<div class="coc-hint">'+hint+'</div>':'')
    + '</div>';
}

// ── PAGE 1 ────────────────────────────────────────────────────────────────────
</script>
