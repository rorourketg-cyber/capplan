<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapPlan — Asset Replacement Analysis</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#F7F8FA;color:#0F1D2E;font-size:14px}
input,select,button{font-family:inherit;font-size:14px}
button{cursor:pointer;background:none;border:none}
select{-webkit-appearance:none;appearance:none}
:root{
  --blue:#1B3F6E;--green:#2E7D52;--surface:#F7F8FA;--panel:#fff;
  --border:#E2E6EC;--t1:#0F1D2E;--t2:#4A5568;--t3:#8A96A6;--warn:#C84B31;
  --blue-soft:rgba(27,63,110,0.08);--green-soft:rgba(46,125,82,0.09);
  --amber:#F59E0B;--amber-soft:#FFFBEB;--amber-dark:#92400E;--amber-mid:#FEF3C7;--amber-light:#FEF3C7;
}
#masthead{background:var(--blue);min-height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 16px;position:sticky;top:0;z-index:100;gap:0}
.logo{display:flex;align-items:center;gap:12px;margin-right:20px;flex-shrink:0}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-text{font-family:Georgia,serif;font-size:22px;color:white}
.logo-text span{color:#A8C5E8}

#stepper{background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px}
.step{display:flex;align-items:center;gap:8px;padding:13px 4px;border-bottom:2px solid transparent}
.step.active{border-bottom-color:var(--blue)}
.step-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--border);color:var(--t3)}
.step.active .step-num{background:var(--blue);color:white}
.step.done .step-num{background:var(--green);color:white}
.step-label{font-size:13px;font-weight:500;color:var(--t3);white-space:nowrap}
.step.active .step-label{color:var(--blue)}
.step.done .step-label{color:var(--green)}
.step-sep{color:var(--border);margin:0 8px;font-size:16px}
.page{max-width:1100px;margin:0 auto;padding:24px 22px}
.page-grid{display:grid;grid-template-columns:310px 1fr;gap:22px}
.p3-grid{display:grid;grid-template-columns:280px 1fr;gap:22px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);overflow:hidden;margin-bottom:18px}
.panel-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.panel-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)}
.field-grid{display:grid;grid-template-columns:1fr 1fr}
.field{padding:13px 18px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.field.full{grid-column:1/-1;border-right:none}
.field.last{border-bottom:none}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:6px}
.field-note{font-size:10px;color:var(--t3);margin-top:4px}
.ui{display:flex;align-items:center;gap:6px}
.ui .pfx,.ui .sfx{font-family:monospace;font-size:12px;color:var(--t3);flex-shrink:0}
.ui input{font-family:monospace;font-size:15px;font-weight:600;color:var(--t1);border:none;border-bottom:2px solid var(--border);background:transparent;width:100%;padding:2px 0;outline:none}
.ui input:focus{border-bottom-color:var(--blue)}
.ui input:disabled{color:var(--t3);opacity:.6}
.ui select{font-family:monospace;font-size:14px;font-weight:600;color:var(--t1);border:none;border-bottom:2px solid var(--border);background:transparent;width:100%;padding:2px 0;outline:none;cursor:pointer}
.ui select:focus{border-bottom-color:var(--blue)}
.pills{display:flex;gap:8px;margin-top:4px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 13px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;user-select:none}
.pill.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.pill-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--t3);flex-shrink:0}
.pill.active .pill-dot{border-color:var(--blue);background:var(--blue)}
.btn-primary{background:var(--blue);color:white;border:none;border-radius:8px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer}
.btn-ghost{background:transparent;color:var(--t2);border:1.5px solid var(--border);border-radius:8px;padding:11px 22px;font-size:13px;font-weight:600;cursor:pointer}
.print-btn{display:flex;align-items:center;gap:6px;background:transparent;color:var(--t2);border:1.5px solid var(--border);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;justify-content:center}
.print-btn:hover{border-color:var(--blue);color:var(--blue)}
.action-row{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.bn-item{border-bottom:1px solid var(--border)}
.bn-item:last-child{border-bottom:none}
.bn-head{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;cursor:pointer}
.bn-head:hover{background:var(--surface)}
.bn-qmark{width:21px;height:21px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--blue);flex-shrink:0;margin-top:1px;margin-right:5px}
.bn-q{font-size:13px;line-height:1.5;color:var(--blue);flex:1}
.bn-arr{color:var(--t3);font-size:14px;flex-shrink:0;margin-top:2px;transition:transform .2s}
.bn-body{padding:10px 13px 12px 44px;font-size:12.5px;line-height:1.7;color:var(--t2);background:var(--surface);border-top:1px solid var(--border);display:none}
.bn-body.open{display:block}

.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:11px}
.p2-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);overflow:hidden;margin-bottom:18px}
.p2-wizard{background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:10px;margin-bottom:18px;overflow:hidden}
.wizard-toggle{padding:12px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--amber-light);border-bottom:1.5px solid var(--amber)}
.wizard-toggle:hover{background:#FDE68A}
.wizard-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.wizard-row{display:flex;flex-direction:column;gap:6px}
.wizard-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-dark)}
.wizard-result{background:var(--green-soft);border:1px solid var(--green);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wizard-use{background:var(--green);color:white;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.underline-input{display:flex;align-items:center;gap:6px}
.underline-input input{font-family:monospace;font-size:15px;font-weight:600;color:var(--t1);border:none;border-bottom:2px solid var(--border);background:transparent;width:100%;padding:2px 0;outline:none}
.underline-input input:focus{border-bottom-color:var(--amber)}
.underline-input .pfx{font-family:monospace;font-size:13px;color:var(--t3);flex-shrink:0}
.underline-input .sfx{font-size:13px;color:var(--t3);flex-shrink:0}
.banner{border-radius:10px;padding:18px 22px;margin-bottom:18px;border:1.5px solid transparent}
.banner.positive{background:var(--green-soft);border-color:var(--green)}
.banner.negative{background:rgba(200,75,49,.07);border-color:var(--warn)}
.banner-headline{font-family:Georgia,serif;font-size:22px;line-height:1.2;font-weight:400}
.banner.positive .banner-headline{color:var(--green)}
.banner.negative .banner-headline{color:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.metric-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:7px}
.metric-val{font-family:monospace;font-size:18px;font-weight:700}
.metric-val.ok{color:var(--green)}
.metric-val.bad{color:var(--warn)}
.metric-sub{font-size:10px;color:var(--t3);margin-top:3px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.chart-title{font-size:14px;font-weight:700;color:var(--t2);margin-bottom:10px}
.collapsible{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:14px;overflow:hidden}
.coll-head{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.coll-head:hover{background:var(--surface)}
.coll-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)}
.coll-arr{color:var(--t3);font-size:14px;transition:transform .2s}
.coll-body{display:none;border-top:1px solid var(--border)}
.coll-body.open{display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 14px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
th.left{text-align:left}
td{padding:8px 14px;text-align:right;font-family:monospace;border-bottom:1px solid var(--border)}
td.left{text-align:left;font-family:inherit;color:var(--t1)}
td.sub{text-align:left;font-family:inherit;color:var(--t3);font-size:11px}
td.neg{color:var(--warn)}
tr.total-row td{font-weight:700;background:var(--surface)}
tr.npv-row td{font-size:15px;font-weight:800;border-top:2px solid var(--blue)}
tr.npv-row.ok td{background:var(--green-soft);color:var(--green)}
tr.npv-row.bad td{background:rgba(200,75,49,.06);color:var(--warn)}
tr:nth-child(even){background:var(--surface)}
.overflow-x{overflow-x:auto}






@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto!important;margin:0!important;padding:0!important;background:white!important}
  #masthead{position:static!important;top:auto!important;height:auto!important;min-height:0!important;padding:8px 0!important;margin:0!important;box-shadow:none!important}
  #stepper,.btn-ghost,.print-btn{display:none!important}
  .coll-arr{display:none!important}
  .coll-head{cursor:default!important;break-after:avoid!important;break-inside:avoid!important}
  .page-grid,.p3-grid{display:block!important}
  aside{display:none!important}
  .coll-body{display:block!important}
  .banner,.metric,.chart-box{box-shadow:none!important;border:1px solid #ccc!important;break-inside:avoid}
  .collapsible{box-shadow:none!important;border:1px solid #ccc!important;break-inside:auto!important}
  #dcf-section{break-before:always!important}
  .charts-grid{grid-template-columns:1fr 1fr}
  .page{max-width:100%!important;padding:8px!important;margin:0!important}
  table{width:100%!important;font-size:8.5px!important;table-layout:fixed!important}
  th,td{padding:3px 4px!important;white-space:normal!important;word-break:break-word}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  .overflow-x{overflow-x:visible!important;overflow:visible!important}
  @page{margin:0.5in;size:landscape}
  thead tr:last-child{break-after:avoid!important}
  tbody tr:first-child{break-before:avoid!important}
  th{break-inside:avoid!important;break-after:avoid!important}
  tbody{orphans:3;widows:3}
  .panel{break-inside:avoid}
  .panel-head{break-after:avoid!important}
  .compare-card{break-inside:avoid!important}
  .collapsible{break-inside:avoid!important}
  .sensitivity-section{break-before:page!important}
}



.model-overview {
  background: var(--amber-soft);
  border: 1.5px solid var(--amber);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--amber-dark);
  line-height: 1.6;
}
.model-overview strong { color: var(--amber-dark); }
.sens-indicator{border-radius:8px;padding:14px 18px;margin-bottom:18px;border:1.5px solid transparent}
.si-positive{background:var(--green-soft);border-color:var(--green)}
.si-negative{background:rgba(200,75,49,.07);border-color:var(--warn)}
.si-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.si-positive .si-title{color:var(--green)}
.si-negative .si-title{color:var(--warn)}
.si-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.si-item{display:flex;flex-direction:column;gap:3px}
.si-label{font-size:11px;color:var(--t2)}
.si-val{font-family:monospace;font-size:20px;font-weight:800}
.si-val.ok{color:var(--green)}.si-val.bad{color:var(--warn)}
.si-sub{font-size:10px;color:var(--t3)}

.sl-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:white;cursor:pointer;white-space:nowrap;transition:background .15s}
.sl-btn:hover{background:rgba(255,255,255,.15)}
.sl-btn svg{flex-shrink:0;pointer-events:none}
.sl-group{display:flex;align-items:center;gap:6px;margin-left:20px}
.sl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8a96a6;margin-bottom:4px}
#save-label-input{width:100%;font-size:13px;padding:6px 8px;border:1px solid #d1d9e0;border-radius:6px;background:#f8f9fa;color:#1a2332;margin-bottom:10px;box-sizing:border-box}
.sl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);cursor:default}
.sl-modal{background:#ffffff;border-radius:12px;padding:24px;width:340px;max-width:90vw;box-shadow:0 4px 6px rgba(0,0,0,.07),0 16px 48px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)}
.sl-modal-title{font-size:15px;font-weight:700;color:#1a2332;margin-bottom:16px}
.sl-modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sl-modal-btn{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.sl-modal-btn.primary{background:var(--blue);color:white}
.sl-modal-btn.secondary{background:#f8f9fa;color:#4a5568;border:1px solid #d1d9e0}
.sl-auto-badge{font-size:10px;background:var(--green-soft);color:var(--green);border-radius:4px;padding:2px 6px;font-weight:700}
.sl-help-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:none;color:white;font-size:12px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;transition:background .15s}
.sl-help-btn:hover{background:rgba(255,255,255,.2)}
.sl-help-panel{font-size:13px;color:#2d3748;line-height:1.6}
.sl-help-panel h3{font-size:14px;font-weight:700;color:#1a2332;margin:0 0 12px}
.sl-help-panel ul{margin:0;padding:0 0 0 18px}
.sl-help-panel li{margin-bottom:8px}
.sl-help-panel li strong{color:#1a2332}
.sl-help-panel .sl-help-note{margin-top:14px;padding:10px 12px;background:#f0f4ff;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;font-size:12px;color:#4a5568}

.sl-list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border)}
.mast-title-block{display:flex;flex-direction:column;justify-content:center;gap:3px;flex:1;min-width:0;padding-right:16px}
.mast-title{font-size:17px;font-weight:800;color:white;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-question{font-size:12px;font-weight:700;font-style:italic;color:rgba(255,255,255,.82);font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
}

@media print{
  body:not(.printing){display:none!important}
}
</style>
</head>
<body>
<div id="masthead">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,10 7,14 15,4"/></svg>
    </div>
    <div class="logo-text">Cap<span>Plan</span></div>
  </div>
  <div class="mast-title-block">
    <div class="mast-title">Asset Replacement Analysis</div>
    <div class="mast-question">Does replacing this asset now make financial sense?</div>
  </div>
  <div style="position:relative" id="cur-wrap">
    <button style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:6px 12px;color:white;font-size:12px;font-weight:600;cursor:pointer" id="cur-btn" onclick="toggleCur()">
      <span id="cur-label">$ USD</span> ▾
    </button>
    <div id="cur-dropdown" style="display:none;position:absolute;right:0;top:110%;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(15,29,46,.16);min-width:200px;z-index:300;overflow:hidden"></div>
  </div>
  <div class="sl-group">
    <button class="sl-help-btn" id="sl-help-btn" title="Save &amp; Load help">?</button>
    <button class="sl-btn" id="sl-save-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="sl-btn" id="sl-load-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Load
    </button>
  </div>
</div>
<div id="stepper">
  <div class="step active" id="step1"><div class="step-num" id="sn1">1</div><div class="step-label">Asset Details</div></div>
  <div class="step-sep">›</div>
  <div class="step" id="step2"><div class="step-num" id="sn2">2</div><div class="step-label">Economic Benefits</div></div>
  <div class="step-sep">›</div>
  <div class="step" id="step3"><div class="step-num" id="sn3">3</div><div class="step-label">Results</div></div>
</div>

<div id="main-content"></div>
<!-- Auth0 SPA SDK + CapPlan auth library -->
<script src="/capplan-auth.js"></script>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
var S = {
  page:1, currency:"USD", cur_open:false,
  coc_open:false,coc_eq_mode:"gordon",coc_kd:6,coc_tax:35,coc_div:0,coc_price:0,coc_g:5,coc_rf:4.5,coc_beta:1.0,coc_mrp:5.5,coc_wd:50,
  show_dcf:false, show_table:false, res_tab:0, show_all:false,
  res:null, missingFields:null,
  // inputs — blank by default
  cost:"", itcPct:"", life:"", salvageNew:"",
  currentSalvage:"",                    // KEY Model 3 addition
  method:"Double-declining", hyr:true, ddbRate:"",
  workingCapital:"", annuity:true, annuityAmount:"",
  yearlyBenefits:[],
  taxRate:"", coc:""
};

var CURRENCIES=[
  {code:"USD",symbol:"$",label:"US Dollar"},
  {code:"EUR",symbol:"€",label:"Euro"},
  {code:"JPY",symbol:"¥",label:"Japanese Yen"},
  {code:"GBP",symbol:"£",label:"British Pound"},
  {code:"INR",symbol:"₹",label:"Indian Rupee"},
  {code:"CHF",symbol:"CHF",label:"Swiss Franc"},
  {code:"CAD",symbol:"CA$",label:"Canadian Dollar"},
  {code:"AUD",symbol:"AU$",label:"Australian Dollar"},
  {code:"NZD",symbol:"NZ$",label:"New Zealand Dollar"}
];
function getSym(){var c=CURRENCIES.find(function(c){return c.code===S.currency});return c?c.symbol:"$"}

function toggleCur(){
  S.cur_open=!S.cur_open;
  var dd=document.getElementById("cur-dropdown");
  dd.style.display=S.cur_open?"block":"none";
  if(S.cur_open){
    dd.innerHTML="";
    CURRENCIES.forEach(function(c){
      var b=document.createElement("button");
      b.style.cssText="display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:"+(c.code===S.currency?"var(--blue-soft)":"transparent")+";border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left";

// ── CALC ──────────────────────────────────────────────────────────────────────
function calcDepr(cost,itcPct,currentSalvage,life,method,hyr,ddbRate){
  // Model 3 depreciable base = cost - (old_salvage + ITC)
  var itc=cost*itcPct/100;
  var base=cost-(currentSalvage+itc);
  var d=[];
  if(method==="Double-declining"){
    var rate=ddbRate/100;
    d.push(base*rate*(hyr?0.5:1));
    for(var y=2;y<=life;y++)d.push((base-d.reduce(function(s,v){return s+v},0))*rate);
  } else if(method==="Straight-line"){
    var y1=base/life*(hyr?0.5:1);d.push(y1);
    for(var y=2;y<=life;y++)d.push(hyr?(base-y1)/(life-1):base/life);
  } else {
    var y1=hyr?base/(life+1):2*base/(life+1);d.push(y1);
    if(hyr)for(var y=2;y<=life;y++)d.push(2*base*(life-y+1)/((life+1)*(life-1)));
    else    for(var y=2;y<=life;y++)d.push(base*(life-y+1)*2/(life*(life+1)));
  }
  return d;
}

function calcAll(){
  var cost=+S.cost,itcPct=+S.itcPct,life=+S.life||1,salvageNew=+S.salvageNew,
      currentSalvage=+S.currentSalvage,ddbRate=+S.ddbRate,
      tx=S.taxRate/100,r=S.coc/100,wc=+S.workingCapital;
  var itc=cost*itcPct/100;
  var ben=S.annuity?Array(life).fill(+S.annuityAmount||0):(S.yearlyBenefits||[]);
  while(ben.length<life)ben.push(0);
  var depr=calcDepr(cost,itcPct,currentSalvage,life,S.method,S.hyr,ddbRate);

  var rows=[];
  for(var i=0;i<life;i++){
    var yr=i+1,btBen=ben[i],atBen=btBen*(1-tx),atShield=depr[i]*tx,
        itcYr=(yr===1?itc:0),totalAT=atBen+atShield+itcYr,
        pvAtBen=atBen/Math.pow(1+r,yr);
    rows.push({yr:yr,btBen:btBen,atBen:atBen,btDepr:depr[i],atShield:atShield,
               itcYr:itcYr,totalAT:totalAT,pvAtBen:pvAtBen});
  }

  // KEY DIFFERENCE: net outflow = cost - current salvage + working capital
  var pvOut=cost-currentSalvage+wc;
  var pvBen=rows.reduce(function(s,row){return s+row.pvAtBen},0);
  var pvITC=itc/(1+r);
  var pvS1=depr.length>0?depr[0]*tx/(1+r):0;
  var pvS2=0;for(var i=1;i<rows.length;i++)pvS2+=rows[i].atShield/Math.pow(1+r,i+1);
  var pvShield=pvS1+pvS2;
  var pvSalv=salvageNew/Math.pow(1+r,life);
  var pvLoss=-(salvageNew*tx)/Math.pow(1+r,life);
  var pvWC=wc/Math.pow(1+r,life);
  var pvIn=pvBen+pvITC+pvShield+pvSalv+pvLoss+pvWC;
  var npv=pvIn-pvOut;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  var anpv=af>0?npv/af:0,bc=pvOut>0?pvIn/pvOut:0;

  function npvR(rate){
    var cfs=[-pvOut];
    for(var i=0;i<life;i++){
      var yr=i+1,cf=ben[i]*(1-tx)+depr[i]*tx;
      if(yr===1)cf+=itc;
      if(yr===life)cf+=salvageNew*(1-tx)+wc;
      cfs.push(cf);
    }
    return cfs.reduce(function(s,cf,i){return s+cf/Math.pow(1+rate,i)},0);
  }
  var irr=r;
  for(var i=0;i<200;i++){
    var f=npvR(irr),df=(npvR(irr+0.0001)-f)/0.0001;
    if(Math.abs(df)<1e-12)break;
    var nx=irr-f/df;if(Math.abs(nx-irr)<1e-9){irr=nx;break;}
    irr=nx;if(irr<-0.99||irr>100){irr=NaN;break;}
  }
  var payback=null,cum=-pvOut;
  for(var i=0;i<rows.length;i++){
    var prev=cum;cum+=rows[i].totalAT;
    if(cum>=0&&prev<0){payback=i+Math.abs(prev)/(Math.abs(prev)+cum);break;}
  }

  var pcts=[-30,-20,-10,0,10,20,30];
  var cocSens=pcts.map(function(p){
    var tc=S.coc*(1+p/100),tr=tc/100,taf=tr>0?(1-Math.pow(1+tr,-life))/tr:life;
    var tpb=S.annuity?S.annuityAmount*(1-tx)*taf:rows.reduce(function(s,row,i){return s+row.atBen/Math.pow(1+tr,i+1)},0);
    var tps=rows.reduce(function(s,row,i){return s+row.atShield/Math.pow(1+tr,i+1)},0);
    return{label:tc.toFixed(1)+"%",npv:tpb+pvITC/(1+tr)*(1+tr)+tps+salvageNew*(1-tx)/Math.pow(1+tr,life)+wc/Math.pow(1+tr,life)-pvOut};
  });
  var base2=S.annuity?(+S.annuityAmount):(ben.reduce(function(s,b){return s+b},0)/Math.max(life,1));
  var benSens=pcts.map(function(p){
    var tb=base2*(1+p/100),tpb=S.annuity?tb*(1-tx)*af:rows.reduce(function(s,_,i){return s+(ben[i]*(1+p/100)*(1-tx))/Math.pow(1+r,i+1)},0);
    return{label:"$"+Math.round(tb/1000)+"k",npv:tpb+pvITC+pvShield+pvSalv+pvLoss+pvWC-pvOut};
  });

  return{rows:rows,depr:depr,pvOut:pvOut,pvBen:pvBen,pvITC:pvITC,pvS1:pvS1,pvS2:pvS2,
    pvShield:pvShield,pvSalv:pvSalv,pvLoss:pvLoss,pvWC:pvWC,pvIn:pvIn,
    npv:npv,anpv:anpv,bc:bc,irr:irr,payback:payback,af:af,
    cocSens:cocSens,benSens:benSens,itc:itc,
    annAmt:S.annuity?(+S.annuityAmount):null,currentSalvage:currentSalvage};
}

function calcBreakEven(){
  var cost=+S.cost,itcPct=+S.itcPct,life=+S.life||1,salvageNew=+S.salvageNew;
  var currentSalvage=+S.currentSalvage,tx=+S.taxRate/100,r=+S.coc/100,wc=+S.workingCapital;
  var itc=cost*itcPct/100;
  // Model 3: depr base = cost - (currentSalvage + ITC)
  var base=cost-(currentSalvage+itc);
  var d=[];
  var method=S.method,hyr=S.hyr,ddbRate=+S.ddbRate;
  if(method==="Double-declining"){
    var rate=ddbRate/100;d.push(base*rate*(hyr?0.5:1));
    for(var y=2;y<=life;y++)d.push((base-d.reduce(function(s,v){return s+v},0))*rate);
  }else if(method==="Straight-line"){
    var y1=base/life*(hyr?0.5:1);d.push(y1);
    for(var y=2;y<=life;y++)d.push(hyr?(base-y1)/(life-1):base/life);
  }else{
    var y1=hyr?base/(life+1):2*base/(life+1);d.push(y1);
    if(hyr)for(var y=2;y<=life;y++)d.push(2*base*(life-y+1)/((life+1)*(life-1)));
    else    for(var y=2;y<=life;y++)d.push(base*(life-y+1)*2/(life*(life+1)));
  }
  // Model 3: pvOut = cost - currentSalvage + wc
  var pvOut=cost-currentSalvage+wc;
  var pvITC=itc/(1+r);
  var pvS1=d.length>0?d[0]*tx/(1+r):0;
  var pvS2=0;for(var i=1;i<d.length;i++)pvS2+=d[i]*tx/Math.pow(1+r,i+1);
  var pvSalv=salvageNew/Math.pow(1+r,life);
  var pvLoss=-(salvageNew*tx)/Math.pow(1+r,life);
  var pvWC=wc/Math.pow(1+r,life);
  var pvFixed=pvITC+pvS1+pvS2+pvSalv+pvLoss+pvWC;
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  return(pvOut-pvFixed)/((1-tx)*af);
}

// ── CANVAS CHART ──────────────────────────────────────────────────────────────
function drawChart(canvasId, data, xLabel) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var fresh=canvas.cloneNode(true);canvas.parentNode.replaceChild(fresh,canvas);canvas=fresh;
  var ctx = canvas.getContext('2d');
  var W=canvas.width, H=canvas.height;
  var pad={top:16,bottom:50,left:64,right:8};
  var cw=W-pad.left-pad.right, ch=H-pad.top-pad.bottom;
  var yKey=data[0]&&data[0].npv!==undefined?'npv':'rate';
  var vals=data.map(function(d){return d[yKey];});
  var maxV=Math.max.apply(null,vals.map(Math.abs))||1;
  var hasNeg=vals.some(function(v){return v<0;});
  var lo=hasNeg?-maxV*1.2:0, hi=maxV*1.2;
  var rng=hi-lo;
  var gap=cw/data.length, bw=Math.floor(gap*0.6);
  var midIdx=Math.floor(data.length/2);
  function toY(v){return pad.top+ch*(hi-v)/rng;}
  var zeroY=toY(0);
  function drawBase(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#E2E6EC'; ctx.lineWidth=1;
    for(var i=0;i<=4;i++){
      var y=pad.top+(ch/4)*i;
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cw,y); ctx.stroke();
      var v=hi-rng*(i/4);
      ctx.fillStyle='#8A96A6'; ctx.font='10px system-ui'; ctx.textAlign='right';
      ctx.fillText(Math.round(v/1000)+'k',pad.left-3,y+3);
    }
    ctx.strokeStyle='#C8D0DA'; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(pad.left,zeroY); ctx.lineTo(pad.left+cw,zeroY); ctx.stroke();
    ctx.setLineDash([]);
    data.forEach(function(d,i){
      var yv=d[yKey];
      var x=pad.left+gap*i+(gap-bw)/2;
      var y0=zeroY, y1=toY(yv), barH=Math.abs(y1-y0), top=Math.min(y0,y1);
      ctx.fillStyle=yv>=0?(i===midIdx?'#2E7D52':'#6DBF8A'):(i===midIdx?'#C84B31':'#E88A8A');
      ctx.fillRect(x,top,bw,Math.max(barH,1));
      ctx.fillStyle=i===midIdx?'#1B3F6E':'#8A96A6';
      ctx.font=(i===midIdx?'bold ':'')+'10px system-ui'; ctx.textAlign='center';
      ctx.fillText(d.label||String(i),x+bw/2,H-pad.bottom+14);
    });
    ctx.strokeStyle='#4A5568'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pad.left,pad.top); ctx.lineTo(pad.left,pad.top+ch); ctx.lineTo(pad.left+cw,pad.top+ch); ctx.stroke();
    ctx.fillStyle='#4A5568'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(xLabel,pad.left+cw/2,H-4);
  }
  function drawTooltip(i){
    var d=data[i], yv=d[yKey];
    var x=pad.left+gap*i+(gap-bw)/2+bw/2, y=toY(yv);
    ctx.strokeStyle='rgba(27,63,110,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.moveTo(x,pad.top); ctx.lineTo(x,pad.top+ch); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#1B3F6E'; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    var xLbl=d.label||String(i);
    var yLbl=(yv>=0?'':'-')+'$'+Math.round(Math.abs(yv)/1000)+'k';
    var text=xLbl+' \u2192 '+yLbl;
    ctx.font='bold 11px system-ui';
    var tw=ctx.measureText(text).width+16, th=22, r2=4;
    var tx=Math.min(Math.max(x-tw/2,pad.left),pad.left+cw-tw);
    var ty=y-th-8; if(ty<pad.top)ty=y+8;
    ctx.fillStyle='rgba(15,29,46,0.88)';
    ctx.beginPath(); ctx.moveTo(tx+r2,ty); ctx.lineTo(tx+tw-r2,ty); ctx.arcTo(tx+tw,ty,tx+tw,ty+r2,r2);
    ctx.lineTo(tx+tw,ty+th-r2); ctx.arcTo(tx+tw,ty+th,tx+tw-r2,ty+th,r2);
    ctx.lineTo(tx+r2,ty+th); ctx.arcTo(tx,ty+th,tx,ty+th-r2,r2);
    ctx.lineTo(tx,ty+r2); ctx.arcTo(tx,ty,tx+r2,ty,r2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='white'; ctx.textAlign='left'; ctx.fillText(text,tx+8,ty+15);
  }
  function hitIdx(cx){
    var rect=canvas.getBoundingClientRect(), scaleX=canvas.width/rect.width;
    var px=(cx-rect.left)*scaleX;
    if(px<pad.left||px>pad.left+cw)return -1;
    return Math.max(0,Math.min(data.length-1,Math.floor((px-pad.left)/gap)));
  }
  canvas.addEventListener('mousemove',function(e){drawBase();var i=hitIdx(e.clientX);if(i>=0)drawTooltip(i);});
  canvas.addEventListener('mouseleave',function(){drawBase();});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];drawBase();var i=hitIdx(t.clientX);if(i>=0)drawTooltip(i);},{passive:false});
  canvas.addEventListener('touchend',function(){drawBase();});
  drawBase();
}

function updateYB(idx,val){while(S.yearlyBenefits.length<=idx)S.yearlyBenefits.push(0);S.yearlyBenefits[idx]=val}
function validateInputs(){
  var errs=[];
  if(+S.cost<=0) errs.push("New asset cost must be greater than zero");
  if(+S.life<=0) errs.push("Asset life must be greater than zero");
  if(S.salvageNew!==undefined&&+S.salvageNew<0) errs.push("New asset salvage cannot be negative");
  if(S.salvageNew!==undefined&&S.cost&&+S.salvageNew>=+S.cost) errs.push("New asset salvage cannot equal or exceed its cost");
  if(+S.currentSalvage<0) errs.push("Current asset trade-in value cannot be negative");
  if(S.method==="Double-declining"&&!(+S.ddbRate>0)) errs.push("Depreciation rate must be greater than zero");

  if(+S.coc<=0) errs.push("Required return must be greater than zero");
  return errs;
}

  if(cl)cl.textContent=getSym()+" "+S.currency;
}

// ── Storage: localStorage primary, IndexedDB secondary ───────────────────
var IDB_NAME='capplan';
var IDB_STORE='analyses';
var IDB_MODEL='M3';
var LS_STORE_KEY='capplan_m3_analyses';  // stores all named analyses
var _idb=null;

// localStorage helpers
function lsGetAll(){
  if(!LS_OK)return [];
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    var rows=[];
    Object.keys(obj).forEach(function(k){rows.push(obj[k]);});
    rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
    return rows;
  }catch(e){return [];}
}

function lsSave(payload){
  if(!LS_OK)return false;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    obj[payload.label]=payload;
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
    console.log('[CapPlan] lsSave: saved label='+payload.label+' total='
      +Object.keys(obj).length);
    return true;
  }catch(e){console.error('[CapPlan] lsSave error',e);return false;}
}

function lsLoad(label){
  if(!LS_OK)return null;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    return obj[label]||null;
  }catch(e){return null;}
}

function lsDelete(label){
  if(!LS_OK)return;
  try{
    var obj=JSON.parse(localStorage.getItem(LS_STORE_KEY)||'{}');
    delete obj[label];
    localStorage.setItem(LS_STORE_KEY,JSON.stringify(obj));
  }catch(e){}
}

// IndexedDB (used when deployed to a persistent origin)
function openIDB(cb){
  if(_idb){return cb(_idb);}
  var req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE)){
      db.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true});
    }
  };
  req.onsuccess=function(e){
    _idb=e.target.result;
    console.log('[CapPlan] openIDB: success, stores:',Array.from(_idb.objectStoreNames));
    cb(_idb);
  };
  req.onerror=function(){console.error('[CapPlan] openIDB error');cb(null);};
}

function idbSave(payload,cb){
  openIDB(function(db){
    if(!db)return cb&&cb(null);
    var rtx=db.transaction(IDB_STORE,'readonly');
    var rreq=rtx.objectStore(IDB_STORE).getAll();
    rreq.onsuccess=function(){
      var rows=rreq.result||[];
      var existing=rows.filter(function(r){
        return r.model===IDB_MODEL&&r.label===payload.label;
      });
      if(existing.length)payload.id=existing[0].id;
      var wtx=db.transaction(IDB_STORE,'readwrite');
      var store=wtx.objectStore(IDB_STORE);
      if(existing.length){
        store.put(payload);
      } else {
        store.add(payload);
      }
      wtx.oncomplete=function(){
        cb&&cb(true);
      };
      wtx.onerror=function(){console.error('[CapPlan] idbSave tx error');cb&&cb(false);};
    };
    rreq.onerror=function(){
      var wtx=db.transaction(IDB_STORE,'readwrite');
      wtx.objectStore(IDB_STORE).add(payload);
      wtx.oncomplete=function(){cb&&cb(true);};
    };
  });
}

function idbGetAll(cb){
  openIDB(function(db){
    if(!db)return cb([]);
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=function(){
      var all=req.result||[];
      var rows=all.filter(function(r){return r.model===IDB_MODEL;});
      rows.sort(function(a,b){return b.saved>a.saved?1:-1;});
      cb(rows);
    };
    req.onerror=function(){console.error('[CapPlan] idbGetAll error');cb([]);};
  });
}

function idbDelete(id,label,cb){
  lsDelete(label);
  openIDB(function(db){
    if(!db)return cb&&cb();
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=function(){cb&&cb();};
  });
}

// Primary save: localStorage. Secondary: IndexedDB.
function storeSave(payload,cb){
  var lsOk=lsSave(payload);
  idbSave(payload,function(idbOk){
    cb&&cb(lsOk||idbOk);
  });
}

// Primary read: localStorage (reliable on localhost).
// Falls back to IndexedDB if localStorage is empty.
function storeGetAll(cb){
  var lsRows=lsGetAll();
  if(lsRows.length>0){
    cb(lsRows);
  } else {
    idbGetAll(cb);
  }
}


// ── Auto-save (localStorage fallback, IndexedDB primary) ─────────────────
var AUTO_SAVE_KEY='capplan_m3_autosave';
var LS_OK=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
var IDB_OK=(location.protocol!=='file:');


function autoSave(){
  var payload=buildPayload('\u2605 Last session');
  // IndexedDB auto-save slot
  // localStorage-primary save (persists reliably on localhost)
  storeSave(payload,null);
}

function buildPayload(label){
  var fields=['currency', 'coc_open', 'coc_eq_mode', 'coc_kd', 'coc_tax', 'coc_div', 'coc_price', 'coc_g', 'coc_rf', 'coc_beta', 'coc_mrp', 'coc_wd', 'cost', 'itcPct', 'life', 'salvage', 'method', 'hyr', 'ddbRate', 'workingCapital', 'annuity', 'annuityAmount', 'yearlyBenefits', 'taxRate', 'coc'];
  var st={};fields.forEach(function(k){st[k]=S[k];});
  return {capplan_version:'1.0',model:IDB_MODEL,saved:new Date().toISOString(),
          label:label||'Untitled',state:st};
}

function applyPayload(p){
  if(!p||!p.state)return false;
  Object.keys(p.state).forEach(function(k){if(k in S)S[k]=p.state[k];});
  S.res=null;S.page=1;S.show_dcf=false;S.show_table=false;
  return true;
}

// ── Save ──────────────────────────────────────────────────────────────────
function saveAnalysis(){
  var lbl='';
  if(LS_OK)try{var ex=JSON.parse(localStorage.getItem(AUTO_SAVE_KEY)||'{}');
    if(ex.label&&ex.label!=='★ Last session')lbl=ex.label;}catch(e){}
  var inp=document.getElementById('save-label-input');
  if(inp){inp.value=lbl;}
  var m=document.getElementById('sl-save-modal');
  if(m){m.style.display='flex';}
  setTimeout(function(){if(inp){inp.focus();inp.select();}},50);
}


function confirmSave(){
  var el=document.getElementById('save-label-input');
  var label=(el?el.value.trim():'')||'Untitled analysis';
  var payload=buildPayload(label);
  function afterSave(){
    var sm=document.getElementById('sl-save-modal');
    if(sm)sm.style.display='none';
    closeSLModal();
    var btn=document.getElementById('sl-save-btn');
    if(btn){var orig=btn.innerHTML;
      btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Saved';
      setTimeout(function(){btn.innerHTML=orig;},1800);}
  }
  storeSave(payload,function(ok){
    afterSave();
  });
}

// ── Export (download file) ────────────────────────────────────────────────
function exportAnalysis(){
  var el=document.getElementById('save-label-input');
  var label=(el?el.value.trim():'')||'CapPlan Analysis';
  var payload=buildPayload(label);
  if(LS_OK)try{localStorage.setItem(AUTO_SAVE_KEY,JSON.stringify(payload));}catch(e){}
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download=label.replace(/[^a-z0-9_\- ]/gi,'_').replace(/\s+/g,'_')+'.json';
  a.click();URL.revokeObjectURL(url);
  closeSLModal();
}

function loadFromIDB(id,label){
  // Try localStorage first (primary store)
  if(label){
    var p=lsLoad(label);
    if(p){
      if(applyPayload(p)){render();closeSLModal();return;}
    }
  }
  // Fall back to IndexedDB
  if(!id){console.error('[CapPlan] loadFromIDB: no id or label found');return;}
  openIDB(function(db){
    if(!db)return;
    var tx=db.transaction(IDB_STORE,'readonly');
    var req=tx.objectStore(IDB_STORE).get(id);
    req.onsuccess=function(){
      var p=req.result;
      if(p&&applyPayload(p)){render();closeSLModal();}
    };
  });
}

function deleteFromIDB(id,label){
  idbDelete(id,label,function(){
    loadAnalysis();
  });
}

// ── Import from file ──────────────────────────────────────────────────────
function handleFileLoad(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(p.model&&p.model!==IDB_MODEL){
        alert('This file is from '+p.model+', not M1. Please load it in the correct model.');return;
      }
      if(applyPayload(p)){
        // also save it into IDB so it appears in the list
        idbSave(p,null);
        render();closeSLModal();
      }
    }catch(err){alert('Could not read file. Please check it is a valid CapPlan JSON file.');}
  };
  reader.readAsText(file);
  event.target.value='';
}

// Attach masthead button listeners after DOM is ready
document.addEventListener("DOMContentLoaded",function(){
  var hb=document.getElementById("sl-help-btn");
  var sb=document.getElementById("sl-save-btn");
  var lb=document.getElementById("sl-load-btn");
  console.log("[CapPlan] masthead listeners attached: help="+!!hb+" save="+!!sb+" load="+!!lb);
  // Use event delegation — catches clicks on button OR any child (SVG, text)
  document.getElementById("masthead").addEventListener("click",function(e){
    var t=e.target;
    // Walk up to find the button in case click landed on SVG or span child
    while(t&&t.tagName!=="BUTTON")t=t.parentElement;
    if(!t)return;
    if(t.id==="sl-save-btn"){console.log("[CapPlan] save btn clicked");saveAnalysis();}
    else if(t.id==="sl-load-btn"){console.log("[CapPlan] load btn clicked");loadAnalysis();}
    else if(t.id==="sl-help-btn"){console.log("[CapPlan] help btn clicked");showSLHelp();}
  });
  // Static save modal buttons
  var csb=document.getElementById('sl-confirm-save-btn');
  var cab=document.getElementById('sl-cancel-save-btn');
  var exb=document.getElementById('sl-export-btn');
  if(csb)csb.addEventListener('click',function(e){e.stopPropagation();confirmSave();});
  if(cab)cab.addEventListener('click',function(e){
    e.stopPropagation();
    var sm=document.getElementById('sl-save-modal');
    if(sm)sm.style.display='none';
  });
  if(exb)exb.addEventListener('click',function(e){e.stopPropagation();exportAnalysis();});
  // Stop clicks inside the modal box from reaching the overlay
  var smInner=document.querySelector('#sl-save-modal .sl-modal');
  if(smInner)smInner.addEventListener('click',function(e){e.stopPropagation();});
  // Click on overlay background closes modal
  var smOv=document.getElementById('sl-save-modal');
  if(smOv)smOv.addEventListener('click',function(){
    smOv.style.display='none';
  });
});
