<script>function calcNPV(cv,price,life,salvage,extraOM,extraBen,coc,tx){
  var r=coc/100;var _tx=tx||0;
  var netOutlay=(price-cv)*(1-_tx);
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  var pvBen=(+extraBen)*af;
  var pvOM=(+extraOM)*af;
  var pvSalv=salvage*(1-_tx)/Math.pow(1+r,life);
  var npv=-netOutlay+pvBen-pvOM+pvSalv;
  return{npv:npv,netOutlay:netOutlay,pvBen:pvBen,pvOM:pvOM,pvSalv:pvSalv,af:af};
}
function getSym(){return '$';}
function toggleCur(){}
function emptyOption(label){return{label:label,price:'',life:'',salvage:'',extraOM:'',extraBen:''};}

function calcNPV(cv,price,life,salvage,extraOM,extraBen,coc,tx){
  var r=coc/100;var _tx=tx||0;
  var netOutlay=(price-cv)*(1-_tx);
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  var pvBen=(+extraBen)*af;
  var pvOM=(+extraOM)*af;
  var pvSalv=salvage*(1-_tx)/Math.pow(1+r,life);
  var npv=-netOutlay+pvBen-pvOM+pvSalv;
  return{npv:npv,netOutlay:netOutlay,pvBen:pvBen,pvOM:pvOM,pvSalv:pvSalv,af:af};
}
function getSym(){return '$';}
function toggleCur(){}
function emptyOption(label){return{label:label,price:'',life:'',salvage:'',extraOM:'',extraBen:''};}

var S={page:1,currency:"USD",cur_open:false,res:null,missingFields:null,activeTab:0,
  mv_open:false,mv_orig:"",mv_age:"",mv_life:"",mv_cond:"good",
  currentValue:"",coc:"",taxRate:"",show_dcf:true,show_sensitivity:false,options:[emptyOption("Option A"),emptyOption("Option B")]};

function calcNPV(cv,price,life,salvage,extraOM,extraBen,coc,tx){
  var r=coc/100;
  var netOutlay=(price-cv)*(1-tx);  // after any applicable tax
  var af=r>0?(1-Math.pow(1+r,-life))/r:life;
  var pvBen=(+extraBen)*af;
  var pvOM=(+extraOM)*af;   // negative extraOM = savings (positive contribution)
  var pvSalv=salvage/Math.pow(1+r,life);
  var npv=-netOutlay+pvBen-pvOM+pvSalv;
  return{npv:npv,netOutlay:netOutlay,pvBen:pvBen,pvOM:pvOM,pvSalv:pvSalv,af:af};
}
function calcAll(){
  var cv=+S.currentValue||0, coc=+S.coc||0, tx=+S.taxRate/100||0;
  var results=S.options.map(function(o,i){
    var r=calcNPV(cv,+o.price,+o.life||1,+o.salvage||0,+o.extraOM||0,+o.extraBen||0,coc,tx);
    return{idx:i,label:o.label,price:+o.price,life:+o.life||1,
           salvage:+o.salvage||0,extraOM:+o.extraOM||0,extraBen:+o.extraBen||0,
           npv:r.npv,netOutlay:r.netOutlay,pvBen:r.pvBen,pvOM:r.pvOM,pvSalv:r.pvSalv,af:r.af};
  });
  // Do Nothing is always NPV=0 — it's the baseline
  var doNothing={idx:-1,label:'Keep current asset',npv:0,isDoNothing:true};
  var all=[doNothing].concat(results);
  var winnerIdx=0;
  for(var i=1;i<all.length;i++) if(all[i].npv>all[winnerIdx].npv) winnerIdx=i;
  var winner=all[winnerIdx];
  var shouldReplace=winner.npv>0&&!winner.isDoNothing;
  return{results:results,all:all,winnerIdx:winnerIdx,winner:winner,
         currentValue:cv,shouldReplace:shouldReplace,coc:coc,tx:tx};
}

function fmt(n,d){if(n==null||isNaN(n))return"--";d=d||0;return n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtM(n){if(n==null||isNaN(n))return"--";var s=getSym();return n<0?"-"+s+fmt(Math.abs(n)):s+fmt(n)}
function updateStepper(){for(var i=1;i<=2;i++){var step=document.getElementById("step"+i),sn=document.getElementById("sn"+i);step.className="step";if(i<S.page){step.classList.add("done");sn.textContent="✓"}else if(i===S.page){step.classList.add("active");sn.textContent=String(i)}else sn.textContent=String(i);var n=i;(function(n,step){step.onclick=function(){if(n<S.page||(n===2&&S.res)){S.page=n;render()}}})(n,step);step.style.cursor=(i<S.page||(i===2&&S.res))?"pointer":"default";}}

  {q:"How is this different from Which Option Should I Buy?",a:"That model compares options without an existing asset. This one accounts for the trade-in value of what you currently own — reducing the net cost of each replacement option."},

];

function estimateMarketValue(){var orig=+S.mv_orig||0,age=+S.mv_age||0,life=+S.mv_life||10;var condFactor={poor:0.7,fair:0.85,good:1.0,excellent:1.15}[S.mv_cond]||1.0;var pctRemaining=Math.max(0.05,1-(age/life)*0.85);return Math.round(orig*pctRemaining*condFactor);}

function validateInputs(){

      h+='<div style="font-family:monospace;font-size:20px;font-weight:800;color:'+color+'">'+fmtM(r.npv)+'</div>';
      h+='<div style="font-size:10px;color:var(--t3);margin-top:2px">Net value vs keeping current</div>';
      if(!r.isDoNothing)h+='<div style="margin-top:8px;font-size:11px;color:var(--t2);line-height:1.6">Price: '+fmtM(r.price)+'<br>Net outlay: '+fmtM(r.netOutlay)+'<br>Life: '+r.life+' yrs</div>';
      else h+='<div style="margin-top:8px;font-size:11px;color:var(--t3);line-height:1.6">Keep asset worth<br>'+fmtM(+S.currentValue)+'<br>No outlay</div>';
      h+='</div>';
    });
    return h+'</div>';
  }
  function buildDCF(){
    var h='<div class="collapsible"><div class="coll-head"><span class="coll-title">Show me the maths</span></div><div class="coll-body open">';
    h+='<div style="font-size:12px;color:var(--t3);padding:8px 18px 6px">At your '+S.coc+'% target return, here is what each option costs and what you gain.</div>';
    res.results.forEach(function(r){
      var isWin=res.shouldReplace&&r.idx===res.winnerIdx;
      h+='<div style="margin-bottom:18px;padding:0 18px"><div style="font-size:12px;font-weight:700;color:'+(isWin?'var(--green)':'var(--t2)')+';margin-bottom:6px">'+r.label+(isWin?' ★':' ')+'</div>';
      h+='<table><tbody>';
      h+='<tr><td class="left">Purchase price</td><td class="sub">Year 0</td><td style="color:var(--warn)">'+fmtM(-r.price)+'</td></tr>';
      h+='<tr><td class="left">Sale of current asset'+(res.tx>0?' (after '+fmt(res.tx*100,1)+'% tax)':'')+'</td><td class="sub">Year 0</td><td style="color:var(--green)">+'+fmtM(+S.currentValue*(1-(res.tx||0)))+'</td></tr>';
      h+='<tr style="border-top:1px solid var(--border)"><td class="left">Net outlay</td><td></td><td style="font-weight:700;color:var(--warn)">'+fmtM(-r.netOutlay)+'</td></tr>';
      if(r.extraBen!==0)h+='<tr><td class="left">Extra annual value</td><td class="sub">'+fmtM(r.extraBen)+'/yr × '+fmt(r.af,2)+'</td><td style="color:var(--green)">+'+fmtM(r.pvBen)+'</td></tr>';
      if(r.extraOM!==0)h+='<tr><td class="left">Change in running costs</td><td class="sub">'+fmtM(r.extraOM)+'/yr × '+fmt(r.af,2)+'</td><td style="color:'+(r.extraOM<0?'var(--green)':'var(--warn)')+'">'+fmtM(-r.pvOM)+'</td></tr>';
      h+='<tr><td class="left">Resale value'+(res.tx>0?' (after tax)':'')+'</td><td class="sub">'+fmtM(r.salvage)+' in yr '+r.life+'</td><td style="color:var(--green)">+'+fmtM(r.pvSalv)+'</td></tr>';
      h+='<tr style="border-top:2px solid var(--border)"><td class="left" colspan="2">Net value vs keeping current</td>';
      h+='<td style="font-weight:800;color:'+(r.npv>=0?'var(--green)':'var(--warn)')+'">'+fmtM(r.npv)+'</td></tr>';
      h+='</tbody></table></div>';
    });
    return h+'</div></div>';
  }
  function buildBreakEven(){
    var h='<div class="collapsible"><div class="coll-head"><span class="coll-title">Break-Even Annual Value</span></div><div class="coll-body open">';
    h+='<div style="font-size:12px;color:var(--t3);padding:6px 18px 8px">The extra annual value each option needs to break even with keeping your current asset.</div>';
    h+='<table><thead><tr><th class="left">Option</th><th>Break-Even Value</th><th>Your Estimate</th><th>Margin</th></tr></thead><tbody>';
    res.results.forEach(function(r){
      var be=r.af>0?(r.netOutlay+r.extraOM*r.af-r.pvSalv)/r.af:0;
      var margin=r.extraBen-be;
      var isWin=res.shouldReplace&&r.idx===res.winnerIdx;
      h+='<tr><td class="left">'+(isWin?'★ ':'')+r.label+'</td><td>'+fmtM(be)+'/yr</td><td>'+fmtM(r.extraBen)+'/yr</td>';
      h+='<td style="color:'+(margin>=0?'var(--green)':'var(--warn)')+'">'+fmtM(margin)+'/yr '+(margin>=0?'✓':'below break-even')+'</td></tr>';
    });
    return h+'</tbody></table></div></div>';
  }
  var pages=[
    {lbl:'',html:buildBanner()},
    {lbl:'Show me the maths',html:buildDCF()},
    {lbl:'Break-Even Analysis',html:buildBreakEven()}
  ];
  var _styleEl=document.createElement('style');
  _styleEl.id='_ps_style';_styleEl.textContent=_styleText;
  document.head.appendChild(_styleEl);
  var _combined=pages.map(function(pg,i){
    var hdr=i===0?_hdr:'<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#8A96A6;margin-bottom:8px">'+pg.lbl+'</div>';
    return '<div class="_pg"'+(i>0?' style="page-break-before:always;break-before:page"':'')+'>'+hdr+pg.html+'</div>';
  }).join('');
  _mc.innerHTML=_combined;
  var _mast=document.getElementById('masthead');var _nav=document.getElementById('nav');var _step=document.getElementById('stepper');
  if(_mast)_mast.style.display='none';if(_step)_step.style.display='none';if(_nav)_nav.style.display='none';
  function _restore(){
    document.body.classList.remove('printing');
    var _se=document.getElementById('_ps_style');if(_se)_se.remove();
    if(_mast)_mast.style.display='';if(_step)_step.style.display='';if(_nav)_nav.style.display='';
    _mc.innerHTML=_saved;S.page=_savedPage;
    S.show_dcf=pd0;S.show_sensitivity=pd1;S.show_maths=pd2;render();
  }
  window.onafterprint=function(){window.onafterprint=null;_restore();};
  document.body.classList.add('printing');window.print();
}
function render(){updateStepper();if(S.page===1)renderPage1();else if(S.page===2&&S.res)renderPage2();}
CapPlanAuth.init('personal4');
   render();
</script></body></html>
